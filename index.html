const AI_PROMPT=`Extract all data from this invoice. Return ONLY valid JSON, no markdown:
{"vendor":"name","invoice_number":"number or null","invoice_date":"YYYY-MM-DD or null","subtotal":0.00,"tax":0.00,"fees":0.00,"total":0.00,"line_items":[{"name":"exact name","quantity":1.0,"unit":"lb","unit_price":0.00,"line_total":0.00}]}
Rules: extract EVERY line item. unit_price=per unit. line_total=qty*unit_price. total=subtotal+tax+fees.`;

const COUNT_PROMPT=`Look at this PDF. Count how many SEPARATE invoices are in it. Each invoice has its own invoice number.
Return ONLY this JSON: {"count":1,"invoices":[{"invoice_number":"28443","vendor":"One Ocean","pages":"1"}]}`;

const MAX_CHUNK_MB=15;

async function callAI(base64,mimeType,apiKey,prompt=AI_PROMPT){
  const isPDF=mimeType==='application/pdf';
  const content=isPDF
    ?[{type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},{type:'text',text:prompt}]
    :[{type:'image',source:{type:'base64',media_type:mimeType,data:base64}},{type:'text',text:prompt}];
  let res;
  try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-opus-4-5',max_tokens:4096,messages:[{role:'user',content}]})});}
  catch(e){throw new Error('Network error — check connection');}
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(`API ${res.status}: ${e.error?.message||'Unknown'}`);}
  const data=await res.json();
  const text=data.content?.[0]?.text||'';
  try{
    const clean=text.replace(/```json|```/g,'').trim();
    try{return JSON.parse(clean);}catch(e){}
    const arr=clean.match(/\[[\s\S]*\]/);const obj=clean.match(/\{[\s\S]*\}/);
    if(arr&&(!obj||arr[0].length>obj[0].length)){const r=JSON.parse(arr[0]);return Array.isArray(r)?r[0]:r;}
    if(obj)return JSON.parse(obj[0]);
    throw new Error('No JSON found');
  }catch(e){throw new Error('Could not parse AI response — try again');}
}

function fileToDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=()=>rej(new Error('Read failed'));r.readAsDataURL(file);});}

// ─── PDF BLOB HOOK ─────────────────────────────────────────────────
function usePdfBlobUrl(dataUrl,active){
  const [url,setUrl]=useState(null);
  useEffect(()=>{
    if(!active||!dataUrl)return;
    try{const b64=dataUrl.split(',')[1];const bin=atob(b64);const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);const blob=new Blob([buf],{type:'application/pdf'});const u=URL.createObjectURL(blob);setUrl(u);return()=>URL.revokeObjectURL(u);}
    catch(e){console.error('PDF blob:',e);}
  },[dataUrl,active]);
  return url;
}

function InvoiceViewer({dataUrl,mimeType,fileName,height=500}){
  const isPDF=(mimeType||'').includes('pdf');
  const blobUrl=usePdfBlobUrl(dataUrl,isPDF);
  if(!dataUrl)return <div style={{textAlign:'center',padding:40,color:'var(--text3)',fontFamily:'var(--mono)',fontSize:11}}>No file attached</div>;
  if(isPDF){
    if(!blobUrl)return <div style={{padding:20,textAlign:'center',fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>Loading PDF…</div>;
    return <div style={{display:'flex',flexDirection:'column',height,gap:6}}>
      <iframe src={blobUrl} style={{flex:1,width:'100%',border:'none',borderRadius:4,background:'#fff'}}/>
      <a href={blobUrl} target="_blank" style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--accent)',textAlign:'center'}}>↗ Open in new tab</a>
    </div>;
  }
  return <img src={dataUrl} style={{width:'100%',borderRadius:4,maxHeight:height,objectFit:'contain'}} alt={fileName}/>;
}

// ─── PDF SPLIT ─────────────────────────────────────────────────────
function parsePageStr(s,total){if(!s)return Array.from({length:total},(_,i)=>i);const idx=new Set();s.split(',').forEach(p=>{const r=p.trim().split('-');if(r.length===2){for(let i=parseInt(r[0])-1;i<parseInt(r[1]);i++)idx.add(i);}else idx.add(parseInt(r[0])-1);});return[...idx].filter(i=>i>=0&&i<total);}

async function splitPDF(arrayBuffer,groups){
  const{PDFDocument}=PDFLib;const src=await PDFDocument.load(arrayBuffer);const chunks=[];
  for(const g of groups){const pdf=await PDFDocument.create();const pages=await pdf.copyPages(src,g.pages);pages.forEach(p=>pdf.addPage(p));const bytes=await pdf.save();const b64=btoa(String.fromCharCode(...new Uint8Array(bytes)));chunks.push({base64:b64,dataUrl:`data:application/pdf;base64,${b64}`,pageNumbers:g.pages.map(i=>i+1)});}
  return chunks;
}

// ─── AUTH SCREENS ──────────────────────────────────────────────────
function AuthScreen({onSuccess}){
  const [mode,setMode]=useState('login'); // login|signup
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [bizName,setBizName]=useState('');
  const [err,setErr]=useState('');
  const [msg,setMsg]=useState('');
  const [loading,setLoading]=useState(false);

  const handleLogin=async()=>{
    setLoading(true);setErr('');
    const{data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){setErr(error.message);setLoading(false);return;}
    onSuccess(data.user);
  };

  const handleSignup=async()=>{
    setLoading(true);setErr('');
    const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://choeunp4.github.io/invoiceintel'}});
    if(error){setErr(error.message);setLoading(false);return;}

    // Check for pending invite
    const inviteEmail=new URLSearchParams(window.location.search).get('invite');
    if(inviteEmail&&data?.user){
      // Find the invite and add user to business
      const{data:invite}=await sb.from('invites').select('*').eq('email',inviteEmail).eq('accepted',false).order('created_at',{ascending:false}).limit(1).single();
      if(invite){
        await sb.from('business_members').insert({business_id:invite.business_id,user_id:data.user.id,role:invite.role,invited_by:invite.invited_by,invited_email:inviteEmail});
        await sb.from('invites').update({accepted:true}).eq('id',invite.id);
        // Clean URL
        window.history.replaceState({},'',window.location.pathname);
      }
    }

    if(data?.session){
      onSuccess(data.session.user);
    } else {
      setMsg('✓ Account created! Check your email to confirm, then sign in.');
      setMode('login');
    }
    setLoading(false);
  };

  const handleGoogle=async()=>{
    const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://choeunp4.github.io/invoiceintel'}});
    if(error)setErr(error.message);
  };

  const inviteParam=new URLSearchParams(window.location.search).get('invite');

  return <div style={{position:'fixed',inset:0,background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',animation:'fadeIn .3s ease'}}>
    <div style={{width:'100%',maxWidth:420,padding:20}}>
      <div style={{textAlign:'center',marginBottom:32}}>
        <div style={{fontFamily:'var(--display)',fontSize:44,letterSpacing:4,color:'var(--accent)'}}>INVOICEINTEL</div>
        <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',letterSpacing:2,marginTop:4}}>Food Cost Intelligence</div>
      </div>

      {inviteParam&&<div style={{background:'rgba(82,201,122,.1)',border:'1px solid var(--green)',borderRadius:4,padding:'10px 14px',fontFamily:'var(--mono)',fontSize:11,color:'var(--green)',marginBottom:12,textAlign:'center'}}>
        🎉 You've been invited! Create an account to join.
      </div>}

      {err&&<div style={{background:'rgba(224,82,82,.12)',border:'1px solid var(--red)',borderRadius:4,padding:'8px 12px',fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',marginBottom:12}}>{err}</div>}
      {msg&&<div style={{background:'rgba(82,201,122,.1)',border:'1px solid var(--green)',borderRadius:4,padding:'8px 12px',fontFamily:'var(--mono)',fontSize:11,color:'var(--green)',marginBottom:12}}>{msg}</div>}

      <div style={{...S.card,marginBottom:12}}>
        <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:2,marginBottom:16}}>{mode==='signup'?'CREATE ACCOUNT':'SIGN IN'}</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {mode==='signup'&&<div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',marginBottom:10,lineHeight:1.8}}>Create your account. You'll set up your business after signing in.</div>}
          <div><label style={S.label}>Email</label><input style={S.input} type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(mode==='signup'?handleSignup():handleLogin())} placeholder="your@email.com"/></div>
          <div><label style={S.label}>Password</label><input style={S.input} type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(mode==='signup'?handleSignup():handleLogin())} placeholder="••••••••"/></div>
        </div>
        <button onClick={mode==='signup'?handleSignup:handleLogin} disabled={loading} style={{...S.btnPrimary,width:'100%',marginTop:14,fontSize:16,letterSpacing:2,opacity:loading?.7:1}}>
          {loading?'…':mode==='signup'?'CREATE ACCOUNT':'SIGN IN'}

          <button onClick={()=>{setMode(mode==='signup'?'login':'signup');setErr('');setMsg('');}} style={{background:'none',border:'none',color:'var(--text3)',fontFamily:'var(--mono)',fontSize:10,cursor:'pointer'}}>
            {mode==='signup'?'Already have an account? Sign in':'No account? Create one'}

      </div>
      <button onClick={handleGoogle} style={{...S.btn,width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:10,padding:'10px',fontSize:12}}>
        <span style={{fontFamily:'serif',fontSize:16,fontWeight:'bold',color:'#4285f4'}}>G</span> Continue with Google

            <div style={{fontFamily:'var(--display)',fontSize:22,letterSpacing:2,marginBottom:4}}>{biz.name}</div>
            <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>Created {biz.created_at?.split('T')[0]}</div>

            {chip(biz.role==='admin'?'var(--accent)':'var(--blue)',biz.role)}
            <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--accent)'}}>Enter →</span>
          </div>
        </div>
      </div>)}

      {creating?<div style={{...S.card,border:'1px solid var(--accent)'}}>
        <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--accent)',letterSpacing:2,marginBottom:12}}>NEW BUSINESS</div>
        {err&&<div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',marginBottom:8}}>{err}</div>}
        <input style={S.input} autoFocus value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&createBusiness()} placeholder="Business name…"/>
        <div style={{display:'flex',gap:10,marginTop:12}}>
          <button onClick={createBusiness} style={{...S.btnPrimary,flex:1,fontSize:15,letterSpacing:1}}>CREATE BUSINESS</button>
          <button onClick={()=>{setCreating(false);setErr('');}} style={S.btn}>Cancel</button>
        </div>
      </div>
      :<button onClick={()=>setCreating(true)} style={{...S.btn,width:'100%',padding:'12px',textAlign:'center',borderStyle:'dashed',marginTop:4,fontSize:12}}>
        + Add Another Business
      </button>}

      <div style={{textAlign:'center',marginTop:16}}>
        <button onClick={()=>sb.auth.signOut()} style={{background:'none',border:'none',color:'var(--text3)',fontFamily:'var(--mono)',fontSize:10,cursor:'pointer'}}>Sign out ({user.email})</button>
      </div>
    </div>
  </div>;
}

// ─── PIN SETUP ─────────────────────────────────────────────────────
function PinSetup({user,onDone,onSkip}){
  const [pin,setPin]=useState('');const [confirm,setConfirm]=useState('');const [step,setStep]=useState('set');const [err,setErr]=useState('');
  const handleDigit=d=>{
    if(step==='set'){const n=pin+d;setPin(n);if(n.length===4)setStep('confirm');}
    else{const n=confirm+d;setConfirm(n);if(n.length===4){
      if(n===pin){
        const stored=JSON.parse(localStorage.getItem('ii_pins')||'[]').filter(p=>p.uid!==user.id);
        stored.push({uid:user.id,email:user.email,pin:n});
        localStorage.setItem('ii_pins',JSON.stringify(stored));
        onDone();
      }else{setErr('PINs do not match');setPin('');setConfirm('');setStep('set');}
    }}
  };
  const cur=step==='set'?pin:confirm;
  return <div style={S.overlay}>
    <div style={{...S.modal,width:320}}>
      <div style={S.modalHdr}><div style={S.modalTitle}>SET YOUR PIN</div></div>
      <div style={{padding:24,textAlign:'center'}}>
        <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)',marginBottom:20,lineHeight:1.8}}>{step==='set'?'Choose a 4-digit PIN for quick login':'Confirm your PIN'}</div>
        <div style={{display:'flex',justifyContent:'center',gap:10,marginBottom:20}}>
          {[0,1,2,3].map(i=><div key={i} style={{width:16,height:16,borderRadius:'50%',background:cur.length>i?'var(--accent)':'var(--bg3)',border:'1px solid var(--border2)'}}/>)}
        </div>
        {err&&<div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',marginBottom:12}}>{err}</div>}
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,maxWidth:220,margin:'0 auto 16px'}}>
          {[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map((d,i)=><button key={i} onClick={()=>{if(d==='⌫'){step==='set'?setPin(p=>p.slice(0,-1)):setConfirm(p=>p.slice(0,-1));}else if(d!=='')handleDigit(String(d));}} style={{...S.btn,padding:'14px',fontSize:20,fontFamily:'var(--display)',letterSpacing:1,opacity:d===''?0:1}} disabled={d===''}>
            {d}
          </button>)}
        </div>
        <button onClick={onSkip} style={{...S.btnGhost,fontSize:10}}>Skip — use email login each time</button>
      </div>
    </div>
  </div>;
}

// ─── UPLOAD MODAL ──────────────────────────────────────────────────
function UploadModal({onClose,onSubmit,onSubmitMany,categories,addCategory,lookupAlias,businessId}){
  const [step,setStep]=useState('drop');
  const [fd,setFd]=useState(null);
  const [countData,setCountData]=useState(null);
  const [err,setErr]=useState('');
  const [status,setStatus]=useState('');
  const [vendor,setVendor]=useState('');
  const [num,setNum]=useState('');
  const [date,setDate]=useState(new Date().toISOString().split('T')[0]);
  const [sub,setSub]=useState('');const [tax,setTax]=useState('');const [fees,setFees]=useState('');const [grand,setGrand]=useState('');
  const [notes,setNotes]=useState('');
  const [lines,setLines]=useState([]);
  const [showPrev,setShowPrev]=useState(false);
  const dropRef=useRef();

  const enrich=items=>(items||[]).map(li=>{
    // Check alias table first (user-confirmed categories only)
    const alias=lookupAlias&&lookupAlias(li.name);
    if(alias){
      if(!categories.includes(alias.category))addCategory(alias.category);
      return{...li,id:Math.random().toString(36).slice(2),category:alias.category,canonical:alias.canonical||li.name,_fromAlias:true};
    }
    // No alias found — leave category blank for manual entry
    return{...li,id:Math.random().toString(36).slice(2),category:'',canonical:li.name,_fromAlias:false};
  });

  const [processing,setProcessing]=useState(false);

  const handleFile=async file=>{
    if(processing)return; // Prevent duplicate calls
    if(!getApiKey()){setErr('No API key — go to Settings');return;}
    setProcessing(true);
    setErr('');
    const dataUrl=await fileToDataUrl(file);
    const fdata={dataUrl,name:file.name,mimeType:file.type};
    setFd(fdata);
    const b64=dataUrl.split(',')[1];
    const isPDF=file.type==='application/pdf';
    const sizeMB=file.size/(1024*1024);

    if(isPDF&&sizeMB>MAX_CHUNK_MB){
      setStep('counting');setStatus(`Large file (${sizeMB.toFixed(1)}MB) — analyzing…`);
      try{
        const cr=await callAI(b64,file.type,getApiKey(),COUNT_PROMPT);
        if(cr.count>1){
          const ab=await file.arrayBuffer();const{PDFDocument}=PDFLib;const src=await PDFDocument.load(ab);const total=src.getPageCount();
          const groups=(cr.invoices||[]).map(inv=>({pages:parsePageStr(inv.pages,total),invoice_number:inv.invoice_number,vendor:inv.vendor}));
          const chunks=await splitPDF(ab,groups);
          setCountData({count:cr.count,invoices:cr.invoices||[],chunks});setStep('confirm');return;
        }
      }catch(e){setErr('Split error: '+e.message);}
      await readSingle(b64,file.type);return;
    }

    if(isPDF){
      setStep('counting');setStatus('Counting invoices…');
      try{
        const cr=await callAI(b64,file.type,getApiKey(),COUNT_PROMPT);
        if(cr.count>1){setCountData({count:cr.count,invoices:cr.invoices||[],chunks:null});setStep('confirm');setProcessing(false);return;}
      }catch(e){console.log('Count failed:',e.message);}
    }
    await readSingle(b64,file.type);
    setProcessing(false);
  };

  const readSingle=async(b64,mimeType)=>{
    setStep('ai');setStatus('Reading invoice…');
    try{
      const p=await callAI(b64,mimeType,getApiKey(),AI_PROMPT);
      setVendor(p.vendor||'');setNum(p.invoice_number||'');setDate(p.invoice_date||new Date().toISOString().split('T')[0]);
      setSub(String(p.subtotal||''));setTax(String(p.tax||''));setFees(String(p.fees||''));setGrand(String(p.total||''));
      setLines(enrich(p.line_items));setStep('form');
    }catch(e){setErr('AI error: '+e.message);setLines([{id:'1',name:'',category:'',quantity:'',unit:'lb',unit_price:'',line_total:'',_fromAlias:false}]);setStep('form');}
  };

  const readMultiple=async()=>{
    setStep('ai');const b64=fd.dataUrl.split(',')[1];
    if(countData.chunks){
      const all=[];
      for(let i=0;i<countData.chunks.length;i++){
        const chunk=countData.chunks[i];setStatus(`Reading invoice ${i+1} of ${countData.chunks.length}…`);
        try{const r=await callAI(chunk.base64,'application/pdf',getApiKey(),AI_PROMPT);const inv=Array.isArray(r)?r[0]:r;all.push({...inv,line_items:enrich(inv.line_items),fileDataUrl:fd.dataUrl,fileName:fd.name,fileType:fd.mimeType,pages:chunk.pageNumbers?.join(',')});}
        catch(e){all.push({vendor:'',invoice_number:`CHUNK-${i+1}`,invoice_date:new Date().toISOString().split('T')[0],subtotal:0,tax:0,fees:0,total:0,line_items:[],fileDataUrl:fd.dataUrl,fileName:fd.name,fileType:fd.mimeType});}
      }
      onSubmitMany(all);return;
    }
    const all=[];
    for(let i=0;i<countData.count;i++){
      const inv=countData.invoices[i]||{};setStatus(`Reading invoice ${i+1} of ${countData.count}…`);
      const p=`Extract data for invoice "${inv.invoice_number||`Invoice ${i+1}`}"${inv.pages?` on page(s) ${inv.pages}`:''} from this PDF. Ignore all other invoices. Return ONLY valid JSON:
{"vendor":"name","invoice_number":"${inv.invoice_number||''}","invoice_date":"YYYY-MM-DD","subtotal":0.00,"tax":0.00,"fees":0.00,"total":0.00,"line_items":[{"name":"exact name","quantity":1.0,"unit":"lb","unit_price":0.00,"line_total":0.00}]}
Extract EVERY line item for this invoice only.`;
      try{const r=await callAI(b64,fd.mimeType,getApiKey(),p);const parsed=Array.isArray(r)?r[0]:r;all.push({...parsed,line_items:enrich(parsed.line_items),fileDataUrl:fd.dataUrl,fileName:fd.name,fileType:fd.mimeType,pages:inv.pages||''});}
      catch(e){all.push({vendor:inv.vendor||'',invoice_number:inv.invoice_number||`INV-${i+1}`,invoice_date:new Date().toISOString().split('T')[0],subtotal:0,tax:0,fees:0,total:0,line_items:[],fileDataUrl:fd.dataUrl,fileName:fd.name,fileType:fd.mimeType});}
    }
    onSubmitMany(all);
  };

  const updL=(id,f,v)=>setLines(prev=>prev.map(l=>l.id===id?{...l,[f]:v}:l));
  const remL=id=>setLines(prev=>prev.filter(l=>l.id!==id));
  const addL=()=>setLines(prev=>[...prev,{id:Math.random().toString(36).slice(2),name:'',category:'',quantity:'',unit:'lb',unit_price:'',line_total:'',_fromAlias:false}]);
  const calc=(parseFloat(sub)||0)+(parseFloat(tax)||0)+(parseFloat(fees)||0);
  const match=grand&&Math.abs(calc-parseFloat(grand))<0.02;

  const submit=()=>{
    if(!vendor.trim()){setErr('Vendor required');return;}
    onSubmit({vendor:vendor.trim(),invoice_number:num||Date.now().toString(),invoice_date:date,subtotal:parseFloat(sub)||0,tax:parseFloat(tax)||0,fees:parseFloat(fees)||0,total:parseFloat(grand)||calc,notes,line_items:lines,fileDataUrl:fd?.dataUrl||null,fileName:fd?.name||null,fileType:fd?.mimeType||null});
  };

  const titles={drop:'NEW INVOICE',counting:'CHECKING PDF…',confirm:'MULTIPLE INVOICES FOUND',ai:'READING INVOICE…',form:'REVIEW INVOICE'};

  return <div style={S.overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={{...S.modal,width:'96%',maxWidth:step==='form'?1060:540,maxHeight:'94vh'}}>
      <div style={S.modalHdr}>
        <div style={S.modalTitle}>{titles[step]||'NEW INVOICE'}</div>
        <button onClick={onClose} style={{background:'none',border:'1px solid var(--border2)',color:'var(--text2)',width:28,height:28,borderRadius:4,fontSize:13,cursor:'pointer'}}>✕</button>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:20}}>
        {err&&<div style={{background:'rgba(224,82,82,.12)',border:'1px solid var(--red)',borderRadius:4,padding:'8px 12px',fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',marginBottom:12}}>{err}</div>}

        {step==='drop'&&<div ref={dropRef} onDragOver={e=>{e.preventDefault();dropRef.current.style.borderColor='var(--accent)';}} onDragLeave={()=>dropRef.current.style.borderColor='var(--border2)'} onDrop={e=>{e.preventDefault();dropRef.current.style.borderColor='var(--border2)';const f=e.dataTransfer.files[0];if(f)handleFile(f);}} onClick={()=>document.getElementById('_fp2').click()} style={{border:'2px dashed var(--border2)',borderRadius:8,padding:52,textAlign:'center',cursor:'pointer',transition:'border-color .2s'}}>
          <div style={{fontSize:44,marginBottom:12}}>📄</div>
          <div style={{fontFamily:'var(--display)',fontSize:22,letterSpacing:2,color:'var(--text2)',marginBottom:8}}>DROP INVOICE HERE</div>
          <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>PDF · JPG · PNG</div>
          <input id="_fp2" type="file" accept="image/*,.pdf" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(f)handleFile(f);}}/>
        </div>}

        {(step==='counting'||step==='ai')&&<div style={{textAlign:'center',padding:44}}>
          <div style={{width:40,height:40,border:'2px solid var(--border2)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin .7s linear infinite',margin:'0 auto 16px'}}/>
          <div style={{fontFamily:'var(--display)',fontSize:22,letterSpacing:2,color:'var(--accent)',marginBottom:8}}>{status}</div>
          {fd&&<div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',marginTop:6}}>📎 {fd.name}</div>}
        </div>}

        {step==='confirm'&&countData&&<div>
          <div style={{background:'rgba(232,197,71,.08)',border:'1px solid rgba(232,197,71,.3)',borderRadius:6,padding:16,marginBottom:20}}>
            <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,color:'var(--accent)',marginBottom:8}}>{countData.count} INVOICES DETECTED</div>
            <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)',marginBottom:14}}>Split into {countData.count} separate review cards?</div>
            {countData.invoices.map((inv,i)=><div key={i} style={{padding:'7px 12px',background:'var(--bg3)',borderRadius:4,marginBottom:5,fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)',display:'flex',gap:12}}>
              <span style={{color:'var(--accent)'}}>#inv{i+1}</span>
              {inv.invoice_number&&<span>{inv.invoice_number}</span>}
              {inv.vendor&&<span style={{color:'var(--text3)'}}>{inv.vendor}</span>}
              {inv.pages&&<span style={{color:'var(--text3)',marginLeft:'auto'}}>p.{inv.pages}</span>}
            </div>)}
          </div>
          <div style={{display:'flex',gap:12}}>
            <button onClick={readMultiple} style={{...S.btnPrimary,flex:1,fontSize:14,letterSpacing:1}}>YES — SPLIT INTO {countData.count} INVOICES</button>
            <button onClick={()=>readSingle(fd.dataUrl.split(',')[1],fd.mimeType)} style={{...S.btn,flex:1,textAlign:'center'}}>No — treat as one</button>
          </div>
        </div>}

        {step==='form'&&<div style={{display:'flex',gap:20,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:280}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
              <div><label style={S.label}>Vendor *</label><input style={S.input} value={vendor} onChange={e=>setVendor(e.target.value)}/></div>
              <div><label style={S.label}>Invoice #</label><input style={S.input} value={num} onChange={e=>setNum(e.target.value)}/></div>
              <div><label style={S.label}>Date</label><input type="date" style={S.input} value={date} onChange={e=>setDate(e.target.value)}/></div>
              <div><label style={S.label}>Notes</label><input style={S.input} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional"/></div>
            </div>
            <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:2,textTransform:'uppercase',marginBottom:8}}>Line Items ({lines.length})</div>
            <div style={{overflowX:'auto'}}><div style={{minWidth:480}}>
              <div style={{display:'grid',gridTemplateColumns:'2fr 1.2fr .55fr .55fr .85fr .85fr 24px',gap:5,marginBottom:5}}>
                {['Item','Category','Qty','Unit','Unit $','Total',''].map(h=><div key={h} style={{fontFamily:'var(--mono)',fontSize:8,color:'var(--text3)',letterSpacing:1,textTransform:'uppercase'}}>{h}</div>)}
              </div>
              <div style={{maxHeight:240,overflowY:'auto'}}>
                {lines.map(l=><div key={l.id} style={{display:'grid',gridTemplateColumns:'2fr 1.2fr .55fr .55fr .85fr .85fr 24px',gap:5,marginBottom:5,alignItems:'center'}}>
                  <input style={{...S.input,fontSize:11,padding:'5px 8px'}} value={l.name} onChange={e=>updL(l.id,'name',e.target.value)} placeholder="Item"/>
                  <CatSelect value={l.category} categories={categories} onChange={v=>{updL(l.id,'category',v);if(v&&!categories.includes(v))addCategory(v);}}/>
                  <input style={{...S.input,fontSize:11,padding:'5px 6px',textAlign:'center'}} type="number" value={l.quantity} onChange={e=>updL(l.id,'quantity',e.target.value)}/>
                  <select style={{...S.select,fontSize:10,padding:'5px 6px'}} value={l.unit||'lb'} onChange={e=>updL(l.id,'unit',e.target.value)}>
                    {['lb','kg','case','each','oz','gallon','qt','dozen'].map(u=><option key={u}>{u}</option>)}
                  </select>
                  <input style={{...S.input,fontSize:11,padding:'5px 6px',fontFamily:'var(--mono)'}} type="number" step="0.01" value={l.unit_price} onChange={e=>updL(l.id,'unit_price',e.target.value)}/>
                  <input style={{...S.input,fontSize:11,padding:'5px 6px',fontFamily:'var(--mono)',background:'var(--bg4)'}} type="number" step="0.01" value={l.line_total} onChange={e=>updL(l.id,'line_total',e.target.value)}/>
                  <button onClick={()=>remL(l.id)} style={{background:'none',border:'1px solid var(--border2)',color:'var(--text3)',width:22,height:22,borderRadius:3,fontSize:11,cursor:'pointer',padding:0}}>✕</button>
                </div>)}
              </div>
            </div></div>
            <button onClick={addL} style={{width:'100%',border:'1px dashed var(--border2)',background:'none',color:'var(--text3)',padding:6,borderRadius:4,fontFamily:'var(--mono)',fontSize:11,cursor:'pointer',marginTop:4}}>+ Add Line</button>
            <div style={{background:'var(--bg3)',borderRadius:4,padding:'12px 14px',marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
              {[['Subtotal',sub,setSub],['Tax',tax,setTax],['Fees',fees,setFees]].map(([lbl,v,set])=><div key={lbl}>
                <label style={S.label}>{lbl}</label>
                <div style={{display:'flex',alignItems:'center',gap:3}}><span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>$</span><input style={{...S.input,fontFamily:'var(--mono)',fontSize:11}} type="number" step="0.01" value={v} onChange={e=>set(e.target.value)} placeholder="0.00"/></div>
              </div>)}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:10,flexWrap:'wrap',gap:10}}>
              <div><label style={S.label}>Grand Total</label>
                <div style={{display:'flex',alignItems:'center',gap:3}}><span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>$</span><input style={{...S.input,fontFamily:'var(--mono)',fontSize:13,border:'1px solid var(--accent)',width:150}} type="number" step="0.01" value={grand} onChange={e=>setGrand(e.target.value)} placeholder="0.00"/></div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:1,marginBottom:4}}>CALCULATED</div>
                <div style={{fontFamily:'var(--display)',fontSize:22,color:'var(--accent)'}}>${calc.toFixed(2)}</div>
                {grand&&<div style={{fontFamily:'var(--mono)',fontSize:10,color:match?'var(--green)':'var(--red)',marginTop:2}}>{match?'✓ Match':'⚑ Diff: $'+Math.abs(calc-parseFloat(grand)).toFixed(2)}</div>}
              </div>
            </div>
          </div>
          <div style={{width:240,flexShrink:0,minWidth:200}}>
            <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:2,textTransform:'uppercase',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              Invoice Preview
              <button onClick={()=>setShowPrev(!showPrev)} style={{...S.btnGhost,fontSize:10,padding:'2px 8px'}}>{showPrev?'Hide':'Show'}</button>
            </div>
            {showPrev&&fd?<InvoiceViewer dataUrl={fd.dataUrl} mimeType={fd.mimeType} fileName={fd.name} height={340}/>
            :<div style={{border:'1px solid var(--border2)',borderRadius:6,padding:20,textAlign:'center'}}>
              <div style={{fontSize:28,marginBottom:8}}>📄</div>
              <div style={{fontFamily:'var(--mono)',fontSize:10,color:fd?'var(--green)':'var(--text3)'}}>{fd?'✓ '+fd.name:'No file'}</div>
              {fd&&<div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',marginTop:4}}>Click "Show" to preview</div>}
            </div>}
          </div>
        </div>}
      </div>
      {step==='form'&&<div style={S.modalFoot}>
        <button onClick={onClose} style={S.btn}>Cancel</button>
        <button onClick={submit} style={S.btnPrimary}>SUBMIT FOR REVIEW →</button>
      </div>}
    </div>
  </div>;
}

// ─── REVIEW MODAL ──────────────────────────────────────────────────
function ReviewModal({invoice,onClose,onApprove,categories,addCategory,lookupAlias}){
  const [lines,setLines]=useState((invoice.line_items||[]).map(l=>({...l,id:l.id||Math.random().toString(36).slice(2),_originalCat:l.category,_categoryChanged:false})));
  const [notes,setNotes]=useState(invoice.notes||'');
  const [showInv,setShowInv]=useState(false);
  const [done,setDone]=useState(false);

  const updL=(id,f,v)=>setLines(prev=>prev.map(l=>{if(l.id!==id)return l;const u={...l,[f]:v};if(f==='category')u._categoryChanged=(v!==l._originalCat);return u;}));
  const remL=id=>setLines(prev=>prev.filter(l=>l.id!==id));

// ─── DATE RANGE BAR ────────────────────────────────────────────────
function DateRangeBar({dateRange,onApply,loading}){
  const [from,setFrom]=useState(dateRange.from);
  const [to,setTo]=useState(dateRange.to);

  const presets=[
    {label:'30 days',days:30},
    {label:'90 days',days:90},
    {label:'6 months',days:180},
    {label:'1 year',days:365},
    {label:'All Time',days:null},
  ];

  const applyPreset=p=>{
    const t=new Date().toISOString().split('T')[0];
    const f=p.days?new Date(Date.now()-p.days*24*60*60*1000).toISOString().split('T')[0]:'2000-01-01';
    setFrom(f);setTo(t);
    onApply(f,t,p.label);
  };

  const applyCustom=()=>onApply(from,to,'Custom');

  return <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:20,flexWrap:'wrap',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:6,padding:'10px 14px'}}>
    <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:2,textTransform:'uppercase',marginRight:4}}>Period:</span>
    {presets.map(p=><button key={p.label} onClick={()=>applyPreset(p)} style={{...S.btn,padding:'4px 10px',fontSize:11,background:dateRange.label===p.label?'var(--accent)':'var(--bg3)',color:dateRange.label===p.label?'#000':'var(--text2)',borderColor:dateRange.label===p.label?'var(--accent)':'var(--border2)'}}>{p.label}</button>)}
    <div style={{display:'flex',alignItems:'center',gap:6,marginLeft:4}}>
      <input type="date" style={{...S.select,fontSize:11,padding:'4px 8px'}} value={from} onChange={e=>setFrom(e.target.value)}/>
      <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>to</span>
      <input type="date" style={{...S.select,fontSize:11,padding:'4px 8px'}} value={to} onChange={e=>setTo(e.target.value)}/>
      <button onClick={applyCustom} style={{...S.btn,padding:'4px 10px',fontSize:11}}>Apply</button>
    </div>
    {loading&&<div style={{display:'flex',alignItems:'center',gap:5,fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>
      <div style={{width:10,height:10,border:'1.5px solid var(--border2)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>
      Loading…
    </div>}
  </div>;
}

function ItemsPage({invoices}){
  const [cat,setCat]=useState('');
  const map={};
  invoices.filter(i=>i.status==='approved').forEach(inv=>{
    (inv.line_items||[]).forEach(li=>{
      const key=li.canonical||li.name;if(!key)return;
      if(!map[key])map[key]={name:key,cat:li.category||'Other',vendors:{}};
      if(li.unit_price&&parseFloat(li.unit_price)>0){
        if(!map[key].vendors[inv.vendor])map[key].vendors[inv.vendor]=[];
        map[key].vendors[inv.vendor].push({price:parseFloat(li.unit_price),unit:li.unit||'lb',date:inv.invoice_date});
      }
    });
  });
  const items=Object.values(map);const cats=[...new Set(items.map(i=>i.cat))].sort();
  const filtered=cat?items.filter(i=>i.cat===cat):items;
  const grouped={};filtered.forEach(i=>{if(!grouped[i.cat])grouped[i.cat]=[];grouped[i.cat].push(i);});
  if(!items.length)return <div style={{textAlign:'center',padding:60,color:'var(--text3)'}}>
    <div style={{fontSize:40,marginBottom:12}}>📊</div>
    <div style={{fontFamily:'var(--display)',fontSize:22,letterSpacing:2}}>NO DATA YET</div>
    <div style={{fontFamily:'var(--mono)',fontSize:10,marginTop:8}}>Approve invoices to see price comparisons</div>
  </div>;
  return <div>
    <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
      <button style={{...S.btn,...(cat===''?{background:'var(--accent)',color:'#000',borderColor:'var(--accent)'}:{})}} onClick={()=>setCat('')}>All</button>
      {cats.map(c=><button key={c} style={{...S.btn,...(cat===c?{background:'var(--accent)',color:'#000',borderColor:'var(--accent)'}:{})}} onClick={()=>setCat(c)}>{c}</button>)}
    </div>
    {Object.entries(grouped).map(([g,gi])=><div key={g} style={{marginBottom:24}}>
      <div style={{fontFamily:'var(--display)',fontSize:16,letterSpacing:2,color:'var(--text2)',borderBottom:'1px solid var(--border)',paddingBottom:6,marginBottom:10}}>{g} <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>({gi.length})</span></div>
      {gi.map(item=>{
        const [open,setOpen]=useState(false);
        const ve=Object.entries(item.vendors);const prices=ve.flatMap(([,ps])=>ps.map(p=>p.price));const best=prices.length?Math.min(...prices):null;
        return <div key={item.name} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:6,marginBottom:8,overflow:'hidden'}}>
          <div onClick={()=>setOpen(!open)} style={{padding:'10px 14px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',background:open?'var(--bg3)':'var(--bg2)'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontFamily:'var(--display)',fontSize:17,letterSpacing:1}}>{item.name}</span>
              <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>{ve.length} vendor{ve.length>1?'s':''}</span>
            </div>
            <div style={{display:'flex',gap:12,alignItems:'center'}}>
              {best&&<span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--accent)'}}>Best: ${best.toFixed(2)}</span>}
              <span style={{color:'var(--text3)'}}>{open?'▲':'▾'}</span>
            </div>
          </div>
          {open&&<div style={{padding:'10px 14px',borderTop:'1px solid var(--border)'}}>
            {ve.map(([v,ps])=>{
              const latest=ps.sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];const isBest=latest?.price===best;
              return <div key={v} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid var(--border)'}}>
                <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>{v}</span>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span style={{fontFamily:'var(--mono)',fontSize:13,color:isBest?'var(--green)':'var(--text)'}}>${latest?.price?.toFixed(2)}/{latest?.unit}{isBest&&<span style={{marginLeft:6,fontSize:10}}> ★ BEST</span>}</span>
                  {!isBest&&best&&<span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--red)'}}>+${(latest?.price-best).toFixed(2)} vs best</span>}
                  <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>{ps.length} order{ps.length>1?'s':''}</span>
                </div>
              </div>;
            })}
          </div>}
        </div>;
      })}
    </div>)}
  </div>;
}

function UsersPage({business,user,showToast}){
  const [members,setMembers]=useState([]);const [loading,setLoading]=useState(true);
  const [inviteEmail,setInviteEmail]=useState('');const [inviteRole,setInviteRole]=useState('viewer');const [err,setErr]=useState('');const [msg,setMsg]=useState('');

  useEffect(()=>{
    sb.from('business_members').select('role,joined_at,user_id,profiles(email,full_name)').eq('business_id',business.id).then(({data})=>{if(data)setMembers(data);setLoading(false);});
  },[business.id]);

  const invite=async()=>{
    if(!inviteEmail.trim()){setErr('Email required');return;}
    setErr('');setMsg('');

    try{
      // Check if user already exists in profiles
      const{data:existing}=await sb.from('profiles').select('id').eq('email',inviteEmail.trim()).single();

      if(existing){
        // User already has an account — just add them to this business
        const{error:memberErr}=await sb.from('business_members').insert({
          business_id:business.id,user_id:existing.id,role:inviteRole,
          invited_by:user.id,invited_email:inviteEmail.trim()
        });
        if(memberErr&&memberErr.code!=='23505'){setErr(memberErr.message);return;}
        setMsg(`✓ ${inviteEmail} added to ${business.name} as ${inviteRole}.`);
      } else {
        // New user — create an invite record they can use to sign up
        const{error:invErr}=await sb.from('invites').insert({
          business_id:business.id,email:inviteEmail.trim(),
          role:inviteRole,invited_by:user.id
        });
        if(invErr){setErr(invErr.message);return;}
        setMsg(`✓ Invite saved for ${inviteEmail}. Share this link with them: https://choeunp4.github.io/invoiceintel?invite=${inviteEmail.trim()}`);
      }
      setInviteEmail('');
      // Refresh members
      const{data:updated}=await sb.from('business_members').select('role,joined_at,user_id,profiles(email,full_name)').eq('business_id',business.id);
      if(updated)setMembers(updated);
    }catch(e){setErr(e.message);}
  };

  const updateRole=async(uid,role)=>{
    await sb.from('business_members').update({role}).eq('business_id',business.id).eq('user_id',uid);
    setMembers(prev=>prev.map(m=>m.user_id===uid?{...m,role}:m));
    showToast('Role updated!');
  };

  const remove=async uid=>{
    if(!confirm('Remove this user from the business?'))return;
    await sb.from('business_members').delete().eq('business_id',business.id).eq('user_id',uid);
    setMembers(prev=>prev.filter(m=>m.user_id!==uid));
    showToast('User removed');
  };

  if(loading)return <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)',padding:20}}>Loading…</div>;

  return <div>
    <div style={{...S.card,marginBottom:20}}>
      <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,marginBottom:14}}>INVITE USER TO {business.name.toUpperCase()}</div>
      {err&&<div style={{background:'rgba(224,82,82,.12)',border:'1px solid var(--red)',borderRadius:4,padding:'8px 12px',fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',marginBottom:10}}>{err}</div>}
      {msg&&<div style={{background:'rgba(82,201,122,.1)',border:'1px solid var(--green)',borderRadius:4,padding:'8px 12px',fontFamily:'var(--mono)',fontSize:11,color:'var(--green)',marginBottom:10}}>{msg}</div>}
      <div style={{display:'grid',gridTemplateColumns:'1fr auto auto',gap:10,alignItems:'end'}}>
        <div><label style={S.label}>Email Address</label><input style={S.input} type="email" value={inviteEmail} onChange={e=>setInviteEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&invite()} placeholder="user@email.com"/></div>
        <div><label style={S.label}>Role</label><select style={{...S.select,width:'100%'}} value={inviteRole} onChange={e=>setInviteRole(e.target.value)}><option value="viewer">Viewer</option><option value="admin">Admin</option></select></div>
        <button onClick={invite} style={{...S.btnPrimary,fontSize:14,padding:'8px 18px',letterSpacing:1,whiteSpace:'nowrap'}}>SEND INVITE</button>
      </div>
      <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',marginTop:8,lineHeight:1.8}}>
        An invite email will be sent. The user sets their password on first login.<br/>
        Viewers can see all data but cannot upload or approve invoices.
      </div>
    </div>
    <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,marginBottom:12}}>TEAM MEMBERS</div>
    <div style={S.tblWrap}>
      <table style={S.tbl}>
        <thead><tr style={{background:'var(--bg3)',borderBottom:'1px solid var(--border)'}}>{['Email','Role','Joined',''].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
        <tbody>
          {members.map(m=><tr key={m.user_id} style={{borderBottom:'1px solid var(--border)'}}>
            <td style={{...S.td,fontFamily:'var(--mono)',fontSize:11}}>{m.profiles?.email||'—'}{m.user_id===user.id&&<span style={{marginLeft:6,fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)'}}>(you)</span>}</td>
            <td style={S.td}>
              {m.user_id===user.id?chip(m.role==='admin'?'var(--accent)':'var(--blue)',m.role)
              :<select value={m.role} onChange={e=>updateRole(m.user_id,e.target.value)} style={{...S.select,fontSize:11,padding:'4px 8px'}}><option value="viewer">Viewer</option><option value="admin">Admin</option></select>}
            </td>
            <td style={{...S.td,fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>{m.joined_at?.split('T')[0]}</td>
            <td style={S.td}>{m.user_id!==user.id&&<button onClick={()=>remove(m.user_id)} style={{...S.btnGhost,fontSize:10,color:'var(--red)',borderColor:'var(--red)'}}>Remove</button>}</td>
          </tr>)}

      </table>
    </div>
  </div>;

// ─── MAIN APP ──────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState('loading'); // loading|auth|picker|pin|app
  const [user,setUser]=useState(null);
  const [business,setBusiness]=useState(null);
  const [memberRole,setMemberRole]=useState('viewer');
  const [showPinSetup,setShowPinSetup]=useState(false);

  // App data
  const [page,setPage]=useState('dashboard');
  const [invoices,setInvoices]=useState([]);
  const [categories,setCategories]=useState([]);
  const [aliases,setAliases]=useState({});
  const [showUpload,setShowUpload]=useState(false);
  const [reviewInv,setReviewInv]=useState(null);
  const [toast,setToast]=useState(null);

  const showToast=(msg,type='')=>setToast({msg,type,id:Date.now()});
  const isAdmin=memberRole==='admin';

  // ── AUTH ──
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if(session){setUser(session.user);checkPinUsers(session.user);}
      else setScreen('auth');
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      if(session&&screen!=='app'){setUser(session.user);checkPinUsers(session.user);}
      else if(!session){setScreen('auth');setUser(null);setBusiness(null);}
    });
    return()=>subscription.unsubscribe();
  },[]);

  const checkPinUsers=u=>{
    const pins=JSON.parse(localStorage.getItem('ii_pins')||'[]');
    const hasPIN=pins.some(p=>p.uid===u.id);
    if(hasPIN){
      setScreen('picker'); // Go to business picker, PIN was already used to log in
    } else {
      setScreen('picker');
      // Offer PIN setup after first login
      setTimeout(()=>setShowPinSetup(true),500);
    }
  };

  const handleAuthSuccess=u=>{
    setUser(u);setScreen('picker');
    const pins=JSON.parse(localStorage.getItem('ii_pins')||'[]');
    if(!pins.some(p=>p.uid===u.id))setTimeout(()=>setShowPinSetup(true),500);
  };

  const [dataLoading,setDataLoading]=useState(false);
  const [dateRange,setDateRange]=useState({
    from:new Date(Date.now()-90*24*60*60*1000).toISOString().split('T')[0],
    to:new Date().toISOString().split('T')[0],
    label:'90 days'
  });

  const selectBusiness=async biz=>{
    setBusiness(biz);
    setMemberRole(biz.role||'viewer');
    setScreen('app');
    setDataLoading(true);
    await loadData(biz.id, dateRange.from, dateRange.to);
    setDataLoading(false);
  };

  const applyDateRange=async(from,to,label)=>{
    const range={from,to,label};
    setDateRange(range);
    if(!business)return;
    setDataLoading(true);
    await loadData(business.id,from,to);
    setDataLoading(false);
  };

  // ── LOAD DATA ──
  const loadData=async(bizId,from,to)=>{
    try{
      let invQuery=sb.from('invoices').select('*').eq('business_id',bizId).order('invoice_date',{ascending:false});
      if(from&&from!=='2000-01-01')invQuery=invQuery.gte('invoice_date',from);
      if(to)invQuery=invQuery.lte('invoice_date',to);

      const[invRes,aliasRes,catRes]=await Promise.all([
        invQuery,
        sb.from('aliases').select('*').eq('business_id',bizId),
        sb.from('categories').select('*').eq('business_id',bizId).order('name'),
      ]);

      if(invRes.error){
        console.error('Invoices query error:',invRes.error.message);
        showToast('Date range query failed — showing all invoices','warn');
        // Fallback: load without date filter
        const{data:fallback}=await sb.from('invoices').select('*').eq('business_id',bizId).order('invoice_date',{ascending:false}).limit(100);
        if(fallback)setInvoices(fallback.map(inv=>({...inv,line_items:[]})));
        if(aliasRes.data){const am={};aliasRes.data.forEach(a=>{am[a.raw_name.toLowerCase().trim()]={rawName:a.raw_name,category:a.category,canonical:a.canonical,count:a.use_count,date:a.updated_at?.split('T')[0]};});setAliases(am);}
        if(catRes.data)setCategories(catRes.data.map(c=>c.name));
        return;
      }

      if(invRes.data&&invRes.data.length>0){
        const invIds=invRes.data.map(i=>i.id);
        const{data:liData}=await sb.from('line_items').select('*').in('invoice_id',invIds);
        const liMap={};(liData||[]).forEach(li=>{
          if(!liMap[li.invoice_id])liMap[li.invoice_id]=[];
          liMap[li.invoice_id].push({...li,_fromAlias:li.from_alias,_originalCat:li.category,_categoryChanged:false});
        });
        setInvoices(invRes.data.map(inv=>({...inv,line_items:liMap[inv.id]||[]})));
      } else {
        setInvoices([]);
      }

      if(aliasRes.data){
        const am={};aliasRes.data.forEach(a=>{am[a.raw_name.toLowerCase().trim()]={rawName:a.raw_name,category:a.category,canonical:a.canonical,count:a.use_count,date:a.updated_at?.split('T')[0]};});
        setAliases(am);
      }
      if(catRes.data)setCategories(catRes.data.map(c=>c.name));
    }catch(e){
      console.error('Load data error:',e.message);
      showToast('Error loading data — please refresh','err');
    }
  };

  const addCategory=async cat=>{
    if(!cat||categories.includes(cat))return;
    setCategories(prev=>[...prev,cat].sort());
    const{error}=await sb.from('categories').insert({business_id:business.id,name:cat});
    if(error&&error.code!=='23505')console.error('Add category error:',error.message);
  };

  const saveAlias=async(rawName,category,canonical)=>{
    if(!rawName||!category||!business)return;
    const key=rawName.toLowerCase().trim();
    const newCount=(aliases[key]?.count||0)+1;
    setAliases(prev=>({...prev,[key]:{rawName,category,canonical,count:newCount,date:new Date().toISOString().split('T')[0]}}));
    const{error}=await sb.from('aliases').upsert({business_id:business.id,raw_name:rawName,category,canonical,use_count:newCount,updated_at:new Date().toISOString(),created_by:user?.id},{onConflict:'business_id,raw_name'});
    if(error)console.error('Save alias error:',error.message);
  };

  const deleteAlias=async rawName=>{
    setAliases(prev=>{const n={...prev};delete n[rawName.toLowerCase().trim()];return n;});
    const{error}=await sb.from('aliases').delete().eq('business_id',business.id).eq('raw_name',rawName);
    if(error)console.error('Delete alias error:',error.message);
  };

  const lookupAlias=rawName=>aliases[rawName?.toLowerCase().trim()]||null;

  const handleSubmit=async inv=>{
    const tempId='tmp_'+Date.now();
    setInvoices(prev=>[{...inv,id:tempId,status:'pending',business_id:business.id},...prev]);
    setShowUpload(false);
    showToast(`Invoice ${inv.invoice_number} submitted!`);
    setPage('dashboard');
    try{
      const{data:saved,error}=await sb.from('invoices').insert({
        business_id:business.id,invoice_number:inv.invoice_number,vendor:inv.vendor,
        invoice_date:inv.invoice_date,subtotal:inv.subtotal,tax:inv.tax,fees:inv.fees,
        total:inv.total,status:'pending',notes:inv.notes||null,file_name:inv.fileName||null,
        file_type:inv.fileType||null,file_data_url:inv.fileDataUrl||null,
        pages:inv.pages||null,created_by:user?.id
      }).select().single();
      if(error)throw error;
      const lis=(inv.line_items||[]).map(l=>({
        invoice_id:saved.id,business_id:business.id,name:l.name,canonical:l.canonical,
        category:l.category,quantity:parseFloat(l.quantity)||0,unit:l.unit||'lb',
        unit_price:parseFloat(l.unit_price)||0,line_total:parseFloat(l.line_total)||0,
        from_alias:l._fromAlias||false
      }));
      if(lis.length){const{error:liErr}=await sb.from('line_items').insert(lis);if(liErr)console.error('Line items save error:',liErr.message);}
      setInvoices(prev=>prev.map(i=>i.id===tempId?{...i,id:saved.id}:i));
    }catch(e){
      console.error('Submit invoice error:',e.message);
      showToast('Invoice saved locally but DB sync failed — please refresh','warn');
    }
  };

  const handleSubmitMany=async invs=>{for(const inv of invs)await handleSubmit(inv);};

  const handleApprove=async(inv,changedLines)=>{
    // Save aliases for any manually changed categories
    if(changedLines){
      for(const l of changedLines){
        if(l.name&&l.category&&l._categoryChanged){
          await saveAlias(l.name,l.category,l.canonical||l.name);
          addCategory(l.category);
        }
      }
    }
    setInvoices(prev=>prev.map(i=>i.id===inv.id?{...inv,status:'approved'}:i));
    setReviewInv(null);
    showToast(`✓ Invoice ${inv.invoice_number} approved!`);
    const{error}=await sb.from('invoices').update({status:'approved',notes:inv.notes||null,approved_by:user?.id,updated_at:new Date().toISOString()}).eq('id',inv.id);
    if(error)console.error('Approve error:',error.message);
  };

  const handleSignOut=async()=>{
    await sb.auth.signOut();
    setScreen('auth');setUser(null);setBusiness(null);
    setInvoices([]);setCategories([]);setAliases({});
  };

  const handleSwitchBusiness=()=>{
    setBusiness(null);setInvoices([]);setCategories([]);setAliases({});
    setScreen('picker');setPage('dashboard');
  };

  const pending=invoices.filter(i=>i.status==='pending').length;
  const pageNames={dashboard:'DASHBOARD',invoices:'INVOICES',items:'ITEMS & PRICES',query:'QUERY ENGINE',aliases:'ALIASES',users:'USER MANAGEMENT',settings:'SETTINGS'};

  // ── SCREENS ──
  if(screen==='loading')return <div style={{position:'fixed',inset:0,background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{textAlign:'center'}}><div style={{fontFamily:'var(--display)',fontSize:36,letterSpacing:4,color:'var(--accent)',marginBottom:16}}>INVOICEINTEL</div><Spinner/></div></div>;

  if(screen==='auth')return <AuthScreen onSuccess={handleAuthSuccess}/>;

  if(screen==='picker')return <>
    <BusinessPicker user={user} onSelect={selectBusiness}/>
    {showPinSetup&&<PinSetup user={user} onDone={()=>setShowPinSetup(false)} onSkip={()=>setShowPinSetup(false)}/>}
  </>;

  // ── MAIN APP ──
  return <div style={S.app}>
    <div style={S.sidebar}>
      <div style={S.logo}>
        <div style={S.logoWord}>INVOICEINTEL</div>
        <div style={S.logoTag}>Food Cost Intelligence</div>
        {business&&<div style={S.bizName}>🏢 {business.name}</div>}
      </div>
      <nav style={{flex:1,paddingTop:8,overflowY:'auto'}}>
        <div style={S.navSec}>Overview</div>
        <NavItem icon="⬡" label="Dashboard" active={page==='dashboard'} onClick={()=>setPage('dashboard')}/>
        <NavItem icon="◫" label="Invoices" active={page==='invoices'} badge={isAdmin?pending:0} onClick={()=>setPage('invoices')}/>
        <div style={S.navSec}>Analysis</div>
        <NavItem icon="◉" label="Items & Prices" active={page==='items'} onClick={()=>setPage('items')}/>
        <NavItem icon="◎" label="Query Engine" active={page==='query'} onClick={()=>setPage('query')}/>
        <NavItem icon="◈" label="Aliases" active={page==='aliases'} onClick={()=>setPage('aliases')}/>
        {isAdmin&&<><div style={S.navSec}>Admin</div><NavItem icon="👥" label="User Management" active={page==='users'} onClick={()=>setPage('users')}/></>}
        <div style={S.navSec}>System</div>
        <NavItem icon="⚙" label="Settings" active={page==='settings'} onClick={()=>setPage('settings')}/>
      </nav>
      <div style={{padding:'12px 14px',borderTop:'1px solid var(--border)'}}>
        {isAdmin&&<button onClick={()=>setShowUpload(true)} style={{...S.btnPrimary,width:'100%',fontSize:15,marginBottom:8}}>+ NEW INVOICE</button>}
        <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user?.email}</div>
        <div style={{fontFamily:'var(--mono)',fontSize:9,color:isAdmin?'var(--accent)':'var(--blue)',marginTop:2}}>{isAdmin?'ADMIN':'VIEWER'}</div>
        {!getApiKey()&&isAdmin&&<div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--red)',marginTop:4}}>⚑ No API key — Settings</div>}
      </div>
    </div>

    <div style={S.main}>
      <div style={S.topbar}>
        <div style={S.pageTitle}>{pageNames[page]||page.toUpperCase()}</div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          {pending>0&&isAdmin&&<span style={{background:'rgba(232,197,71,.12)',border:'1px solid var(--accent)',color:'var(--accent)',padding:'5px 12px',borderRadius:4,fontFamily:'var(--mono)',fontSize:11,cursor:'pointer'}} onClick={()=>setPage('invoices')}>⏳ {pending} PENDING</span>}
          <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>{invoices.filter(i=>i.status==='approved').length} inv · ${invoices.filter(i=>i.status==='approved').reduce((s,i)=>s+(parseFloat(i.total)||0),0).toFixed(2)}</span>
        </div>
      </div>
      <div style={S.content}>
        {page==='dashboard'&&<Dashboard invoices={invoices} onReview={isAdmin?setReviewInv:null} isAdmin={isAdmin} dateRange={dateRange} onDateChange={applyDateRange} dataLoading={dataLoading}/>}
        {page==='invoices'&&<InvoicesPage invoices={invoices} onReview={isAdmin?setReviewInv:null} isAdmin={isAdmin} dateRange={dateRange} onDateChange={applyDateRange} dataLoading={dataLoading}/>}
        {page==='items'&&<ItemsPage invoices={invoices}/>}
        {page==='query'&&<QueryPage invoices={invoices}/>}
        {page==='aliases'&&<AliasesPage aliases={aliases} onDelete={isAdmin?deleteAlias:null} onEdit={isAdmin?(r,c)=>saveAlias(r,c,c):null} categories={categories} isAdmin={isAdmin}/>}
        {page==='users'&&isAdmin&&<UsersPage business={business} user={user} showToast={showToast}/>}
        {page==='settings'&&<SettingsPage onSignOut={handleSignOut} business={business} user={user} showToast={showToast} onSwitchBusiness={handleSwitchBusiness}/>}
      </div>
    </div>

    {showUpload&&isAdmin&&<UploadModal onClose={()=>setShowUpload(false)} onSubmit={handleSubmit} onSubmitMany={handleSubmitMany} categories={categories} addCategory={addCategory} lookupAlias={lookupAlias} businessId={business?.id}/>}
    {reviewInv&&isAdmin&&<ReviewModal invoice={reviewInv} onClose={()=>setReviewInv(null)} onApprove={handleApprove} categories={categories} addCategory={addCategory} lookupAlias={lookupAlias}/>}

    {toast&&<div key={toast.id} style={{position:'fixed',bottom:22,right:22,background:'var(--bg3)',border:'1px solid var(--border2)',borderLeft:`3px solid ${toast.type==='err'?'var(--red)':toast.type==='warn'?'var(--accent)':'var(--green)'}`,borderRadius:4,padding:'10px 16px',fontFamily:'var(--mono)',fontSize:12,zIndex:999,maxWidth:320,cursor:'pointer',animation:'fadeIn .2s ease'}} onClick={()=>setToast(null)}>{toast.msg}</div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
