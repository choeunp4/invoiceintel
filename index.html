const MAX_CHUNK_MB = 15; // max size per chunk sent to AI
const MAX_CHUNK_BYTES = MAX_CHUNK_MB * 1024 * 1024;

// Split a PDF into chunks of pages, keeping invoice pages together
async function splitPDFIntoChunks(arrayBuffer, invoicePageGroups) {
  const { PDFDocument } = PDFLib;
  const srcPdf = await PDFDocument.load(arrayBuffer);
  const totalPages = srcPdf.getPageCount();
  const chunks = [];

  // If we have page group info from the count step, use it
  // Otherwise fall back to size-based splitting
  if(invoicePageGroups && invoicePageGroups.length > 0) {
    // Group invoices into chunks that fit under MAX_CHUNK_BYTES
    let currentGroup = [];
    for(const group of invoicePageGroups) {
      currentGroup.push(group);
      // Estimate size: (pages in group / total pages) * total size
      const estimatedBytes = (currentGroup.reduce((s,g)=>s+g.pageCount,0) / totalPages) * arrayBuffer.byteLength;
      if(estimatedBytes > MAX_CHUNK_BYTES * 0.9) {
        chunks.push(currentGroup);
        currentGroup = [];
      }
    }
    if(currentGroup.length > 0) chunks.push(currentGroup);
  } else {
    // Size-based: split every N pages where N keeps us under MAX_CHUNK_BYTES
    const bytesPerPage = arrayBuffer.byteLength / totalPages;
    const pagesPerChunk = Math.max(1, Math.floor(MAX_CHUNK_BYTES / bytesPerPage));
    for(let i = 0; i < totalPages; i += pagesPerChunk) {
      const pageNums = [];
      for(let j = i; j < Math.min(i + pagesPerChunk, totalPages); j++) pageNums.push(j);
      chunks.push([{ pages: pageNums }]);
    }
  }

  // Build PDF for each chunk
  const chunkDataUrls = [];
  for(const group of chunks) {
    const newPdf = await PDFDocument.create();
    const pageIndexes = group.flatMap(g => g.pages || g.pageNums || []);
    const copied = await newPdf.copyPages(srcPdf, pageIndexes);
    copied.forEach(p => newPdf.addPage(p));
    const bytes = await newPdf.save();
    const b64 = btoa(String.fromCharCode(...new Uint8Array(bytes)));
    chunkDataUrls.push({
      dataUrl: `data:application/pdf;base64,${b64}`,
      base64: b64,
      pageIndexes,
      pageNumbers: pageIndexes.map(i => i + 1),
    });
  }
  return chunkDataUrls;
}

// Parse page string like "1", "1-2", "1,3" into 0-based indexes
function parsePageString(pageStr, totalPages) {
  if(!pageStr) return Array.from({length:totalPages},(_,i)=>i);
  const indexes = new Set();
  pageStr.split(',').forEach(part => {
    const range = part.trim().split('-');
    if(range.length === 2) {
      for(let i = parseInt(range[0])-1; i < parseInt(range[1]); i++) indexes.add(i);
    } else {
      indexes.add(parseInt(range[0])-1);
    }
  });
  return [...indexes].filter(i => i >= 0 && i < totalPages);
}

const AI_PROMPT = `Extract all data from this invoice. Return ONLY valid JSON, no markdown:
{"vendor":"name","invoice_number":"number or null","invoice_date":"YYYY-MM-DD or null","subtotal":0.00,"tax":0.00,"fees":0.00,"total":0.00,"line_items":[{"name":"exact name","quantity":1.0,"unit":"lb","unit_price":0.00,"line_total":0.00}]}
Rules: extract EVERY line item. unit_price=per unit. line_total=qty*unit_price. total=subtotal+tax+fees.`;

const COUNT_PROMPT = `Look at this PDF. Count how many SEPARATE invoices are in it. Each invoice has its own invoice number and/or vendor.
Return ONLY this JSON: {"count":2,"invoices":[{"invoice_number":"28443","vendor":"One Ocean","pages":"1"},{"invoice_number":"28444","vendor":"One Ocean","pages":"2"}]}
If there is only 1 invoice return: {"count":1,"invoices":[]}`;

const MULTI_PROMPT = (n) => `This PDF contains ${n} separate invoices. Extract each one completely. Return ONLY this JSON array, no markdown:
[{"vendor":"name","invoice_number":"number","invoice_date":"YYYY-MM-DD","subtotal":0.00,"tax":0.00,"fees":0.00,"total":0.00,"pages":"1-2","line_items":[{"name":"exact name","quantity":1.0,"unit":"lb","unit_price":0.00,"line_total":0.00}]},{"vendor":"name","invoice_number":"number2",...}]
Rules: extract EVERY line item for each invoice separately. Do not mix line items between invoices.`;

async function callAI(base64, mimeType, apiKey, prompt=AI_PROMPT) {
  const isPDF = mimeType === 'application/pdf';

  // Check file size — base64 of 5MB+ PDFs can cause issues
  const sizeMB = (base64.length * 0.75) / (1024*1024);
  console.log(`[AI] File size: ${sizeMB.toFixed(1)}MB, type: ${mimeType}`);

  if(sizeMB > 15) throw new Error(`File too large (${sizeMB.toFixed(1)}MB). Please use a PDF under 15MB or a photo.`);

  const content = isPDF
    ? [{type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},{type:'text',text:prompt}]
    : [{type:'image',source:{type:'base64',media_type:mimeType,data:base64}},{type:'text',text:prompt}];

  console.log('[AI] Calling Anthropic API…');

  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({model:'claude-opus-4-5',max_tokens:4096,messages:[{role:'user',content}]})
    });
  } catch(e) {
    console.error('[AI] Fetch error:', e);
    throw new Error('Network error — check your internet connection and try again. If on a phone, try on desktop first.');
  }

  if(!res.ok){
    const e = await res.json().catch(()=>({}));
    console.error('[AI] API error:', res.status, e);
    throw new Error(`API error ${res.status}: ${e.error?.message||'Unknown error'}`);
  }

  const data = await res.json();
  console.log('[AI] Success, content blocks:', data.content?.length);
  const text = data.content?.[0]?.text||'';
  try {
    const text2 = text.replace(/```json|```/g,'').trim();
    // Try direct parse first
    try { return JSON.parse(text2); } catch(e) {}
    // Try to extract JSON object or array from text
    const objMatch = text2.match(/\{[\s\S]*\}/);
    const arrMatch = text2.match(/\[[\s\S]*\]/);
    if(arrMatch && (!objMatch || arrMatch[0].length > objMatch[0].length)) {
      const arr = JSON.parse(arrMatch[0]);
      // If array was returned for single invoice prompt, return first item
      return Array.isArray(arr) ? arr[0] : arr;
    }
    if(objMatch) return JSON.parse(objMatch[0]);
    throw new Error('No JSON found in response');
  } catch(e) {
    console.error('[AI] JSON parse error, raw text:', text.substring(0,500));
    throw new Error('Could not parse AI response — try again');
  }
}

// ─── FILE TO BASE64 ────────────────────────────────────────────────
function fileToDataUrl(file) {
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = () => rej(new Error('File read failed'));
    r.readAsDataURL(file);
  });
}

// ─── PDF BLOB URL ──────────────────────────────────────────────────
function usePdfBlobUrl(dataUrl, isActive) {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    if(!isActive || !dataUrl) return;
    try {
      const b64 = dataUrl.split(',')[1];
      const bin = atob(b64);
      const buf = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
      const blob = new Blob([buf],{type:'application/pdf'});
      const u = URL.createObjectURL(blob);
      setUrl(u);
      return () => URL.revokeObjectURL(u);
    } catch(e) { console.error('PDF blob error:',e); }
  }, [dataUrl, isActive]);
  return url;
}

// ─── INVOICE VIEWER ────────────────────────────────────────────────
function InvoiceViewer({ dataUrl, mimeType, fileName, height=500 }) {
  const isPDF = (mimeType||'').includes('pdf');
  const blobUrl = usePdfBlobUrl(dataUrl, isPDF);

  if(!dataUrl) return (
    <div style={{textAlign:'center',padding:40,color:'var(--text3)',fontFamily:'var(--mono)',fontSize:11}}>
      No file attached
    </div>
  );

  if(isPDF) {
    if(!blobUrl) return <div style={{padding:20,textAlign:'center',fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>Loading PDF…</div>;
    return (
      <div style={{display:'flex',flexDirection:'column',height,gap:6}}>
        <iframe src={blobUrl} style={{flex:1,width:'100%',border:'none',borderRadius:4,background:'#fff'}} />
        <a href={blobUrl} target="_blank" style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--accent)',textAlign:'center'}}>↗ Open in new tab</a>
      </div>
    );
  }

  return <img src={dataUrl} style={{width:'100%',borderRadius:4,maxHeight:height,objectFit:'contain'}} alt={fileName||'Invoice'} />;
}

      <div style={{fontFamily:'var(--display)',fontSize:26,letterSpacing:1,lineHeight:1}}>{value}</div>
      {sub&&<div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',marginTop:5}}>{sub}</div>}
    </div>
  );
}

// ─── CAT SELECT ────────────────────────────────────────────────────
function CatSelect({value,onChange,categories}) {
  const [creating,setCreating] = useState(false);
  const [newVal,setNewVal] = useState('');

  if(creating) return (
    <div style={{display:'flex',gap:4}}>
      <input autoFocus value={newVal} onChange={e=>setNewVal(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&newVal.trim()){onChange(newVal.trim());setCreating(false);setNewVal('');}}} placeholder="Category name…" style={{...S.input,fontSize:11,padding:'5px 8px'}}/>
      <button onClick={()=>{if(newVal.trim()){onChange(newVal.trim());setCreating(false);setNewVal('');}}} style={{...S.btn,background:'var(--accent)',color:'#000',padding:'4px 8px',border:'none'}}>✓</button>
      <button onClick={()=>setCreating(false)} style={{...S.btnGhost,padding:'4px 8px'}}>✕</button>
    </div>
  );

  return (
    <select value={value||''} onChange={e=>{if(e.target.value==='__new__'){setCreating(true);}else{onChange(e.target.value);}}} style={{...S.select,fontSize:10,width:'100%'}}>
      <option value="__new__">+ New Category…</option>
      <option value="" disabled>──────────</option>
      {value&&!categories.includes(value)&&<option value={value}>{value}</option>}
      {categories.map(c=><option key={c} value={c}>{c}</option>)}
    </select>
  );
}

// ─── UPLOAD MODAL ──────────────────────────────────────────────────
function UploadModal({onClose,onSubmitMany,onSubmit,categories,addCategory,lookupAlias}) {
  const [step,setStep] = useState('drop'); // drop|counting|confirm|ai|form
  const [fileData,setFileData] = useState(null);
  const [countData,setCountData] = useState(null); // {count, invoices}
  const [err,setErr] = useState('');
  const [aiStatus,setAiStatus] = useState('');
  // Single invoice form state
  const [vendor,setVendor] = useState('');
  const [num,setNum] = useState('');
  const [date,setDate] = useState(new Date().toISOString().split('T')[0]);
  const [subtotal,setSubtotal] = useState('');
  const [tax,setTax] = useState('');
  const [fees,setFees] = useState('');
  const [grand,setGrand] = useState('');
  const [notes,setNotes] = useState('');
  const [lines,setLines] = useState([]);
  const [showPreview,setShowPreview] = useState(false);
  const dropRef = useRef();

  const enrichLines = (items) => (items||[]).map(li=>{
    // Check alias table first (user-confirmed)
    const alias = lookupAlias && lookupAlias(li.name);
    if(alias){
      if(!categories.includes(alias.category)) addCategory(alias.category);
      return {...li, id:Math.random().toString(36).slice(2), category:alias.category, canonical:alias.canonical||li.name, _fromAlias:true};
    }
    // Fall back to keyword matcher
    const m = matchItem(li.name);
    if(m&&!categories.includes(m.cat)) addCategory(m.cat);
    return {...li, id:Math.random().toString(36).slice(2), category:m?.cat||'', canonical:m?.name||li.name, _fromAlias:false};
  });

  const handleFile = async file => {
    if(!getKey()){setErr('No API key — go to Settings first');return;}
    setErr('');
    const dataUrl = await fileToDataUrl(file);
    const fd = {dataUrl, name:file.name, mimeType:file.type};
    setFileData(fd);
    const base64 = dataUrl.split(',')[1];
    const isPDF = file.type === 'application/pdf';
    const fileSizeMB = file.size / (1024*1024);

    if(isPDF && fileSizeMB > MAX_CHUNK_MB) {
      // Large PDF — need to split first
      setStep('counting');
      setAiStatus(`Large file detected (${fileSizeMB.toFixed(1)}MB) — analyzing pages…`);
      try {
        // Step 1: Count invoices and get page assignments
        const countResult = await callAI(base64, file.type, getKey(), COUNT_PROMPT);
        const count = countResult.count || 1;

        // Step 2: Build page groups from count result
        const arrayBuffer = await file.arrayBuffer();
        const { PDFDocument } = PDFLib;
        const srcPdf = await PDFDocument.load(arrayBuffer);
        const totalPages = srcPdf.getPageCount();

        let pageGroups = [];
        if(countResult.invoices && countResult.invoices.length > 0) {
          pageGroups = countResult.invoices.map(inv => ({
            pages: parsePageString(inv.pages, totalPages),
            pageCount: parsePageString(inv.pages, totalPages).length,
            invoice_number: inv.invoice_number,
            vendor: inv.vendor,
          }));
        } else {
          // No page info — split evenly
          const pagesPerInvoice = Math.ceil(totalPages / count);
          for(let i = 0; i < totalPages; i += pagesPerInvoice) {
            const pages = Array.from({length:Math.min(pagesPerInvoice,totalPages-i)},(_,j)=>i+j);
            pageGroups.push({pages, pageCount:pages.length});
          }
        }

        // Step 3: Split PDF into chunks
        setAiStatus(`Splitting into ${pageGroups.length} invoice chunks…`);
        const chunks = await splitPDFIntoChunks(arrayBuffer, pageGroups);

        if(count > 1) {
          // Show confirm screen with chunk info
          setCountData({
            count,
            invoices: countResult.invoices || pageGroups.map((g,i)=>({invoice_number:`Invoice ${i+1}`, pages: g.pageNumbers?.join(',') || ''})),
            chunks,
            arrayBuffer,
          });
          setStep('confirm');
        } else {
          // Single invoice but large file — use first chunk
          await readSingle(chunks[0].base64, file.type);
        }
      } catch(e) {
        setErr('Split error: '+e.message+' — trying to read as-is');
        await readSingle(base64, file.type);
      }
      return;
    }

    if(isPDF) {
      // Normal size PDF — count invoices first
      setStep('counting');
      setAiStatus('Counting invoices in PDF…');
      try {
        const countResult = await callAI(base64, file.type, getKey(), COUNT_PROMPT);
        if(countResult.count > 1) {
          setCountData({...countResult, chunks:null});
          setStep('confirm');
          return;
        }
      } catch(e) {
        console.log('Count failed, treating as single:', e.message);
      }
    }

    await readSingle(base64, file.type);
  };

  const readSingle = async (base64, mimeType) => {
    setStep('ai');
    setAiStatus('Reading invoice…');
    try {
      const parsed = await callAI(base64, mimeType, getKey(), AI_PROMPT);
      setVendor(parsed.vendor||'');
      setNum(parsed.invoice_number||'');
      setDate(parsed.invoice_date||new Date().toISOString().split('T')[0]);
      setSubtotal(String(parsed.subtotal||''));
      setTax(String(parsed.tax||''));
      setFees(String(parsed.fees||''));
      setGrand(String(parsed.total||''));
      setLines(enrichLines(parsed.line_items));
      setStep('form');
    } catch(e) {
      setErr('AI error: '+e.message);
      setLines([{id:'1',name:'',category:'',quantity:'',unit:'lb',unit_price:'',line_total:''}]);
      setStep('form');
    }
  };

  const readMultiple = async () => {
    setStep('ai');
    const base64 = fileData.dataUrl.split(',')[1];

    // If we have pre-split chunks (large file), process each chunk separately
    if(countData.chunks && countData.chunks.length > 0) {
      const allInvoices = [];
      for(let i = 0; i < countData.chunks.length; i++) {
        const chunk = countData.chunks[i];
        setAiStatus(`Reading invoice ${i+1} of ${countData.chunks.length}…`);
        try {
          const result = await callAI(chunk.base64, 'application/pdf', getKey(), AI_PROMPT);
          const inv = Array.isArray(result) ? result[0] : result;
          allInvoices.push({
            ...inv,
            line_items: enrichLines(inv.line_items),
            fileDataUrl: fileData.dataUrl, // full PDF for reference
            fileName: fileData.name,
            fileType: fileData.mimeType,
            pages: chunk.pageNumbers?.join(',') || String(i+1),
          });
        } catch(e) {
          console.error(`Chunk ${i+1} error:`, e);
          allInvoices.push({
            vendor: '',
            invoice_number: `CHUNK-${i+1}`,
            invoice_date: new Date().toISOString().split('T')[0],
            subtotal:0, tax:0, fees:0, total:0,
            line_items:[],
            fileDataUrl: fileData.dataUrl,
            fileName: fileData.name,
            fileType: fileData.mimeType,
            _error: e.message,
          });
        }
      }
      onSubmitMany(allInvoices.filter(inv => inv.invoice_number));
      return;
    }

    // Normal size multi-invoice — read ONE AT A TIME using invoice numbers from count step
    setAiStatus(`Reading ${countData.count} invoices one by one…`);
    const allInvoices = [];
    const invList = countData.invoices || [];

    for(let i = 0; i < countData.count; i++) {
      const invInfo = invList[i];
      const invNum = invInfo?.invoice_number || `Invoice ${i+1}`;
      const pages = invInfo?.pages || '';
      setAiStatus(`Reading invoice ${i+1} of ${countData.count}: ${invNum}…`);

      const targetPrompt = `Extract data for invoice number "${invNum}"${pages ? ` on page(s) ${pages}` : ''} from this PDF. Ignore all other invoices. Return ONLY valid JSON, no markdown:
{"vendor":"name","invoice_number":"${invNum}","invoice_date":"YYYY-MM-DD","subtotal":0.00,"tax":0.00,"fees":0.00,"total":0.00,"line_items":[{"name":"exact name","quantity":1.0,"unit":"lb","unit_price":0.00,"line_total":0.00}]}
Rules: extract EVERY line item for this invoice only. unit_price=per unit. line_total=qty*unit_price.`;

      try {
        const result = await callAI(base64, fileData.mimeType, getKey(), targetPrompt);
        const inv = Array.isArray(result) ? result[0] : result;
        allInvoices.push({
          vendor: inv.vendor||'',
          invoice_number: inv.invoice_number||invNum,
          invoice_date: inv.invoice_date||new Date().toISOString().split('T')[0],
          subtotal: parseFloat(inv.subtotal)||0,
          tax: parseFloat(inv.tax)||0,
          fees: parseFloat(inv.fees)||0,
          total: parseFloat(inv.total)||0,
          notes: '',
          line_items: enrichLines(inv.line_items),
          fileDataUrl: fileData.dataUrl,
          fileName: fileData.name,
          fileType: fileData.mimeType,
          pages,
        });
      } catch(e) {
        console.error(`Invoice ${invNum} error:`, e.message);
        // Add placeholder so user knows one failed
        allInvoices.push({
          vendor: invInfo?.vendor||'',
          invoice_number: invNum,
          invoice_date: new Date().toISOString().split('T')[0],
          subtotal:0, tax:0, fees:0, total:0,
          line_items:[],
          fileDataUrl: fileData.dataUrl,
          fileName: fileData.name,
          fileType: fileData.mimeType,
          pages,
          _error: `Failed to read: ${e.message}`,
        });
      }
    }
    onSubmitMany(allInvoices);
  };

  const updateLine = (id,field,val) => setLines(prev=>prev.map(l=>l.id===id?{...l,[field]:val}:l));
  const removeLine = id => setLines(prev=>prev.filter(l=>l.id!==id));
  const addLine = () => setLines(prev=>[...prev,{id:Math.random().toString(36).slice(2),name:'',category:'',quantity:'',unit:'lb',unit_price:'',line_total:''}]);

  const calc = (parseFloat(subtotal)||0)+(parseFloat(tax)||0)+(parseFloat(fees)||0);
  const match = grand && Math.abs(calc-parseFloat(grand))<0.02;

  const submit = () => {
    if(!vendor.trim()){setErr('Vendor name required');return;}
    onSubmit({
      vendor:vendor.trim(), invoice_number:num||(Date.now().toString()),
      invoice_date:date, subtotal:parseFloat(subtotal)||0,
      tax:parseFloat(tax)||0, fees:parseFloat(fees)||0,
      total:parseFloat(grand)||calc, notes,
      line_items:lines,
      fileDataUrl:fileData?.dataUrl||null,
      fileName:fileData?.name||null,
      fileType:fileData?.mimeType||null,
    });
  };

  const stepTitle = {drop:'NEW INVOICE',counting:'CHECKING PDF…',confirm:'MULTIPLE INVOICES FOUND',ai:'READING INVOICE…',form:'REVIEW INVOICE'}[step]||'NEW INVOICE';

  return (
    <div style={S.overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{...S.modal,width:'96%',maxWidth:step==='form'?1060:560,maxHeight:'94vh'}}>
        <div style={S.modalHdr}>
          <div style={S.modalTitle}>{stepTitle}</div>
          <button onClick={onClose} style={{background:'none',border:'1px solid var(--border2)',color:'var(--text2)',width:28,height:28,borderRadius:4,fontSize:13,cursor:'pointer'}}>✕</button>
        </div>

        <div style={{flex:1,overflowY:'auto',padding:20}}>
          {err&&<div style={{background:'rgba(224,82,82,.12)',border:'1px solid var(--red)',borderRadius:4,padding:'8px 12px',fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',marginBottom:12}}>{err}</div>}

          {/* DROP */}
          {step==='drop'&&(
            <div ref={dropRef} onDragOver={e=>{e.preventDefault();dropRef.current.style.borderColor='var(--accent)';}} onDragLeave={()=>dropRef.current.style.borderColor='var(--border2)'} onDrop={e=>{e.preventDefault();dropRef.current.style.borderColor='var(--border2)';const f=e.dataTransfer.files[0];if(f)handleFile(f);}} onClick={()=>document.getElementById('_filePick').click()} style={{border:'2px dashed var(--border2)',borderRadius:8,padding:52,textAlign:'center',cursor:'pointer',transition:'border-color .2s'}}>
              <div style={{fontSize:44,marginBottom:12}}>📄</div>
              <div style={{fontFamily:'var(--display)',fontSize:22,letterSpacing:2,color:'var(--text2)',marginBottom:8}}>DROP INVOICE HERE</div>
              <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>Click to browse · PDF · JPG · PNG</div>
              <input id="_filePick" type="file" accept="image/*,.pdf" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(f)handleFile(f);}}/>
            </div>
          )}

          {/* COUNTING / AI PROCESSING */}
          {(step==='counting'||step==='ai')&&(
            <div style={{textAlign:'center',padding:44}}>
              <div style={{width:40,height:40,border:'2px solid var(--border2)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin .7s linear infinite',margin:'0 auto 16px'}}/>
              <div style={{fontFamily:'var(--display)',fontSize:22,letterSpacing:2,color:'var(--accent)',marginBottom:8}}>{aiStatus}</div>
              {fileData&&<div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',marginTop:6}}>📎 {fileData.name}</div>}
            </div>
          )}

          {step==='confirm'&&countData&&(
            <div>
              <div style={{background:'rgba(232,197,71,.08)',border:'1px solid rgba(232,197,71,.3)',borderRadius:6,padding:16,marginBottom:20}}>
                <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,color:'var(--accent)',marginBottom:8}}>
                  {countData.count} INVOICES DETECTED
                </div>
                <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)',marginBottom:14}}>
                  Claude found {countData.count} separate invoices{countData.chunks?' (large file — pre-split into chunks)':''}. Split into individual review cards?
                </div>
                {countData.invoices?.length>0&&(
                  <div style={{marginBottom:14,maxHeight:200,overflowY:'auto'}}>
                    {countData.invoices.map((inv,i)=>(
                      <div key={i} style={{padding:'7px 12px',background:'var(--bg3)',borderRadius:4,marginBottom:5,fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)',display:'flex',gap:12}}>
                        <span style={{color:'var(--accent)',flexShrink:0}}>#{i+1}</span>
                        {inv.invoice_number&&<span style={{flexShrink:0}}>Invoice {inv.invoice_number}</span>}
                        {inv.vendor&&<span style={{color:'var(--text3)'}}>{inv.vendor}</span>}
                        {inv.pages&&<span style={{color:'var(--text3)',marginLeft:'auto'}}>Pages: {inv.pages}</span>}
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <div style={{display:'flex',gap:12}}>
                <button onClick={readMultiple} style={{...S.btnPrimary,flex:1,fontSize:15,letterSpacing:1}}>
                  YES — SPLIT INTO {countData.count} INVOICES
                </button>
                <button onClick={()=>readSingle(fileData.dataUrl.split(',')[1],fileData.mimeType)} style={{...S.btn,flex:1,textAlign:'center'}}>
                  No — treat as one invoice
                </button>
              </div>
            </div>
          )}

          {/* SINGLE INVOICE FORM */}
          {step==='form'&&(
            <div style={{display:'flex',gap:20,flexWrap:'wrap'}}>
              <div style={{flex:1,minWidth:280}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
                  <div><label style={S.label}>Vendor *</label><input style={S.input} value={vendor} onChange={e=>setVendor(e.target.value)} placeholder="Vendor name"/></div>
                  <div><label style={S.label}>Invoice #</label><input style={S.input} value={num} onChange={e=>setNum(e.target.value)} placeholder="INV-001"/></div>
                  <div><label style={S.label}>Date</label><input type="date" style={S.input} value={date} onChange={e=>setDate(e.target.value)}/></div>
                  <div><label style={S.label}>Notes</label><input style={S.input} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional"/></div>
                </div>
                <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:2,textTransform:'uppercase',marginBottom:8}}>Line Items ({lines.length})</div>
                <div style={{overflowX:'auto'}}>
                <div style={{minWidth:480}}>
                <div style={{display:'grid',gridTemplateColumns:'2fr 1.2fr .55fr .55fr .85fr .85fr 24px',gap:5,marginBottom:5}}>
                  {['Item','Category','Qty','Unit','Unit $','Total',''].map(h=><div key={h} style={{fontFamily:'var(--mono)',fontSize:8,color:'var(--text3)',letterSpacing:1,textTransform:'uppercase'}}>{h}</div>)}
                </div>
                <div style={{maxHeight:260,overflowY:'auto'}}>
                  {lines.map(l=>(
                    <div key={l.id} style={{display:'grid',gridTemplateColumns:'2fr 1.2fr .55fr .55fr .85fr .85fr 24px',gap:5,marginBottom:5,alignItems:'center'}}>
                      <input style={{...S.input,fontSize:11,padding:'5px 8px'}} value={l.name} onChange={e=>updateLine(l.id,'name',e.target.value)} placeholder="Item"/>
                      <CatSelect value={l.category} categories={categories} onChange={v=>{updateLine(l.id,'category',v);if(v&&!categories.includes(v))addCategory(v);}}/>
                      <input style={{...S.input,fontSize:11,padding:'5px 6px',textAlign:'center'}} type="number" value={l.quantity} onChange={e=>updateLine(l.id,'quantity',e.target.value)}/>
                      <select style={{...S.select,fontSize:10,padding:'5px 6px'}} value={l.unit||'lb'} onChange={e=>updateLine(l.id,'unit',e.target.value)}>
                        {['lb','kg','case','each','oz','gallon','qt','dozen'].map(u=><option key={u}>{u}</option>)}
                      </select>
                      <input style={{...S.input,fontSize:11,padding:'5px 6px',fontFamily:'var(--mono)'}} type="number" step="0.01" value={l.unit_price} onChange={e=>updateLine(l.id,'unit_price',e.target.value)}/>
                      <input style={{...S.input,fontSize:11,padding:'5px 6px',fontFamily:'var(--mono)',background:'var(--bg4)'}} type="number" step="0.01" value={l.line_total} onChange={e=>updateLine(l.id,'line_total',e.target.value)}/>
                      <button onClick={()=>removeLine(l.id)} style={{background:'none',border:'1px solid var(--border2)',color:'var(--text3)',width:22,height:22,borderRadius:3,fontSize:11,cursor:'pointer',padding:0}}>✕</button>
                    </div>
                  ))}
                </div>
                </div>
                </div>
                <button onClick={addLine} style={{width:'100%',border:'1px dashed var(--border2)',background:'none',color:'var(--text3)',padding:6,borderRadius:4,fontFamily:'var(--mono)',fontSize:11,cursor:'pointer',marginTop:4}}>+ Add Line</button>
                <div style={{background:'var(--bg3)',borderRadius:4,padding:'12px 14px',marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
                  {[['Subtotal',subtotal,setSubtotal],['Tax',tax,setTax],['Fees',fees,setFees]].map(([lbl,v,set])=>(
                    <div key={lbl}><label style={S.label}>{lbl}</label>
                      <div style={{display:'flex',alignItems:'center',gap:3}}><span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>$</span><input style={{...S.input,fontFamily:'var(--mono)',fontSize:11}} type="number" step="0.01" value={v} onChange={e=>set(e.target.value)} placeholder="0.00"/></div>
                    </div>
                  ))}
                </div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:10}}>
                  <div>
                    <label style={S.label}>Grand Total (from invoice)</label>
                    <div style={{display:'flex',alignItems:'center',gap:3}}><span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>$</span><input style={{...S.input,fontFamily:'var(--mono)',fontSize:13,border:'1px solid var(--accent)',width:150}} type="number" step="0.01" value={grand} onChange={e=>setGrand(e.target.value)} placeholder="0.00"/></div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:1,marginBottom:4}}>CALCULATED</div>
                    <div style={{fontFamily:'var(--display)',fontSize:22,color:'var(--accent)'}}>${calc.toFixed(2)}</div>
                    {grand&&<div style={{fontFamily:'var(--mono)',fontSize:10,color:match?'var(--green)':'var(--red)',marginTop:2}}>{match?'✓ Totals match':'⚑ Difference: $'+Math.abs(calc-parseFloat(grand)).toFixed(2)}</div>}
                  </div>
                </div>
              </div>
              <div style={{width:240,flexShrink:0,minWidth:200}}>
                <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:2,textTransform:'uppercase',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  Invoice Preview
                  <button onClick={()=>setShowPreview(!showPreview)} style={{...S.btnGhost,fontSize:10,padding:'2px 8px'}}>{showPreview?'Hide':'Show'}</button>
                </div>
                {showPreview&&fileData?(
                  <InvoiceViewer dataUrl={fileData.dataUrl} mimeType={fileData.mimeType} fileName={fileData.name} height={380}/>
                ):(
                  <div style={{border:'1px solid var(--border2)',borderRadius:6,padding:24,textAlign:'center'}}>
                    <div style={{fontSize:32,marginBottom:8}}>📄</div>
                    <div style={{fontFamily:'var(--mono)',fontSize:10,color:fileData?'var(--green)':'var(--text3)'}}>{fileData?'✓ '+fileData.name:'No file'}</div>
                    {fileData&&<div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',marginTop:4}}>Click "Show" to preview</div>}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>

        {step==='form'&&(
          <div style={S.modalFoot}>
            <button onClick={onClose} style={S.btn}>Cancel</button>
            <button onClick={submit} style={S.btnPrimary}>SUBMIT FOR REVIEW →</button>
          </div>
        )}
      </div>
    </div>
  );

// ─── REVIEW MODAL ──────────────────────────────────────────────────
function ReviewModal({invoice,onClose,onApprove,categories,addCategory,lookupAlias}) {
  const [lines,setLines] = useState((invoice.line_items||[]).map(l=>({
    ...l,
    id:l.id||Math.random().toString(36).slice(2),
    _originalCat: l.category, // track original for change detection
    _categoryChanged: false,
  })));
  const [notes,setNotes] = useState(invoice.notes||'');
  const [showInv,setShowInv] = useState(false);
  const [done,setDone] = useState(false);

  const updateLine = (id,f,v) => setLines(prev=>prev.map(l=>{
    if(l.id!==id) return l;
    const updated = {...l,[f]:v};
    // Track if category was manually changed
    if(f==='category') updated._categoryChanged = (v !== l._originalCat);
    return updated;
  }));
  const removeLine = id => setLines(prev=>prev.filter(l=>l.id!==id));
  const addLine = () => setLines(prev=>[...prev,{id:Math.random().toString(36).slice(2),name:'',category:'',quantity:'',unit:'lb',unit_price:'',line_total:'',_fromAlias:false,_categoryChanged:false}]);

  const diff = Math.abs(((parseFloat(invoice.subtotal)||0)+(parseFloat(invoice.tax)||0)+(parseFloat(invoice.fees)||0))-(parseFloat(invoice.total)||0));
  const match = diff<0.02;

  const approve = () => {
    setDone(true);
    onApprove({...invoice,line_items:lines,notes}, lines);

// ─── ITEMS PAGE ────────────────────────────────────────────────────
function ItemsPage({invoices}) {
  const [cat,setCat] = useState('');
  const itemMap = {};
  invoices.filter(i=>i.status==='approved').forEach(inv=>{
    (inv.line_items||[]).forEach(li=>{
      const key=li.canonical||li.name;
      if(!key)return;
      if(!itemMap[key])itemMap[key]={name:key,cat:li.category||'Other',vendors:{}};
      if(li.unit_price&&parseFloat(li.unit_price)>0){
        if(!itemMap[key].vendors[inv.vendor])itemMap[key].vendors[inv.vendor]=[];
        itemMap[key].vendors[inv.vendor].push({price:parseFloat(li.unit_price),unit:li.unit||'lb',date:inv.invoice_date});
      }
    });
  });
  const items=Object.values(itemMap);
  const cats=[...new Set(items.map(i=>i.cat))].sort();
  const filtered=cat?items.filter(i=>i.cat===cat):items;
  const grouped={};
  filtered.forEach(i=>{if(!grouped[i.cat])grouped[i.cat]=[];grouped[i.cat].push(i);});

  if(!items.length)return <div style={{textAlign:'center',padding:60,color:'var(--text3)'}}><div style={{fontSize:40,marginBottom:12}}>📊</div><div style={{fontFamily:'var(--display)',fontSize:22,letterSpacing:2}}>NO DATA YET</div><div style={{fontFamily:'var(--mono)',fontSize:10,marginTop:8}}>Approve invoices to see price comparisons</div></div>;

  return <div>
    <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
      <button style={{...S.btn,...(cat===''?{background:'var(--accent)',color:'#000',borderColor:'var(--accent)'}:{})}} onClick={()=>setCat('')}>All</button>
      {cats.map(c=><button key={c} style={{...S.btn,...(cat===c?{background:'var(--accent)',color:'#000',borderColor:'var(--accent)'}:{})}} onClick={()=>setCat(c)}>{c}</button>)}
    </div>
    {Object.entries(grouped).map(([g,gitems])=>(
      <div key={g} style={{marginBottom:24}}>
        <div style={{fontFamily:'var(--display)',fontSize:16,letterSpacing:2,color:'var(--text2)',borderBottom:'1px solid var(--border)',paddingBottom:6,marginBottom:10}}>{g} <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>({gitems.length})</span></div>
        {gitems.map(item=>{
          const [open,setOpen]=useState(false);
          const vends=Object.entries(item.vendors);
          const prices=vends.flatMap(([,ps])=>ps.map(p=>p.price));
          const best=prices.length?Math.min(...prices):null;
          return <div key={item.name} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:6,marginBottom:8,overflow:'hidden'}}>
            <div onClick={()=>setOpen(!open)} style={{padding:'10px 14px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',background:open?'var(--bg3)':'var(--bg2)'}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontFamily:'var(--display)',fontSize:17,letterSpacing:1}}>{item.name}</span>
                <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>{vends.length} vendor{vends.length>1?'s':''}</span>
              </div>
              <div style={{display:'flex',gap:12,alignItems:'center'}}>
                {best&&<span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--accent)'}}>Best: ${best.toFixed(2)}</span>}
                <span style={{color:'var(--text3)'}}>{open?'▲':'▾'}</span>
              </div>
            </div>
            {open&&<div style={{padding:'10px 14px',borderTop:'1px solid var(--border)'}}>
              {vends.map(([v,ps])=>{
                const latest=ps.sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
                const isBest=latest?.price===best;
                return <div key={v} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid var(--border)'}}>
                  <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>{v}</span>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontFamily:'var(--mono)',fontSize:13,color:isBest?'var(--green)':'var(--text)',fontWeight:isBest?600:400}}>${latest?.price?.toFixed(2)}/{latest?.unit}{isBest&&<span style={{marginLeft:6,fontSize:10}}> ★ BEST</span>}</span>
                    {!isBest&&best&&<span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--red)'}}>+${(latest?.price-best).toFixed(2)} vs best</span>}
                    <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>{ps.length} order{ps.length>1?'s':''}</span>
                  </div>
                </div>;
              })}
            </div>}
          </div>;
        })}
      </div>
    ))}
  </div>;
}

// ─── QUERY PAGE ────────────────────────────────────────────────────
function QueryPage({invoices}) {
  const [vendor,setVendor]=useState('');const [from,setFrom]=useState('');const [to,setTo]=useState('');const [status,setStatus]=useState('');const [results,setResults]=useState(null);
  const vendors=[...new Set(invoices.map(i=>i.vendor))].sort();
  const run=()=>{
    let r=[...invoices];
    if(vendor)r=r.filter(i=>i.vendor===vendor);
    if(from)r=r.filter(i=>i.invoice_date>=from);
    if(to)r=r.filter(i=>i.invoice_date<=to);
    if(status)r=r.filter(i=>i.status===status);
    setResults(r);
  };
  const total=results?.reduce((s,i)=>s+(parseFloat(i.total)||0),0)||0;
  const vb={};results?.forEach(i=>{vb[i.vendor]=(vb[i.vendor]||0)+(parseFloat(i.total)||0);});

  return <div>
    <div style={{...S.card,border:'1px solid var(--accent)',marginBottom:20}}>
      <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,color:'var(--accent)',marginBottom:14}}>CUSTOM QUERY</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10,marginBottom:14}}>
        <div><label style={S.label}>Date From</label><input type="date" style={{...S.select,width:'100%'}} value={from} onChange={e=>setFrom(e.target.value)}/></div>
        <div><label style={S.label}>Date To</label><input type="date" style={{...S.select,width:'100%'}} value={to} onChange={e=>setTo(e.target.value)}/></div>
        <div><label style={S.label}>Vendor</label><select style={{...S.select,width:'100%'}} value={vendor} onChange={e=>setVendor(e.target.value)}><option value="">All</option>{vendors.map(v=><option key={v}>{v}</option>)}</select></div>
        <div><label style={S.label}>Status</label><select style={{...S.select,width:'100%'}} value={status} onChange={e=>setStatus(e.target.value)}><option value="">All</option><option>approved</option><option>pending</option></select></div>
      </div>
      <div style={{display:'flex',gap:10}}>
        <button onClick={run} style={S.btnPrimary}>RUN QUERY</button>
        <button onClick={()=>{setVendor('');setFrom('');setTo('');setStatus('');setResults(null);}} style={S.btn}>Clear</button>
      </div>
    </div>
    {results&&<>
      <div style={S.statGrid}>
        <StatCard label="Total Spend" value={`$${total.toFixed(2)}`}/>
        <StatCard label="Invoices" value={results.length} accent="var(--green)"/>
        <StatCard label="Avg Invoice" value={results.length?`$${(total/results.length).toFixed(2)}`:'$0'} accent="var(--blue)"/>
        <StatCard label="Vendors" value={Object.keys(vb).length} accent="var(--orange)"/>
      </div>
      {Object.keys(vb).length>1&&<div style={{...S.card,marginBottom:20}}>
        <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:2,textTransform:'uppercase',marginBottom:10}}>Vendor Breakdown</div>
        {Object.entries(vb).sort((a,b)=>b[1]-a[1]).map(([v,a])=>(
          <div key={v} style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
            <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text2)',width:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v}</span>
            <div style={{flex:1,height:14,background:'var(--bg3)',borderRadius:2}}><div style={{height:'100%',width:`${(a/total)*100}%`,background:'var(--accent)',borderRadius:2}}/></div>
            <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text2)',width:60,textAlign:'right'}}>${(a/1000).toFixed(1)}k</span>
          </div>
        ))}
      </div>}
      <div style={S.tblWrap}>
        <table style={S.tbl}>
          <thead><tr style={{background:'var(--bg3)',borderBottom:'1px solid var(--border)'}}>
            {['Invoice #','Vendor','Date','Total','Status'].map(h=><th key={h} style={S.th}>{h}</th>)}
          </tr></thead>
          <tbody>
            {results.map(inv=><tr key={inv.id} style={{borderBottom:'1px solid var(--border)'}}>
              <td style={{...S.td,fontFamily:'var(--mono)',fontSize:12}}>{inv.invoice_number}</td>
              <td style={{...S.td,fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>{inv.vendor}</td>
              <td style={{...S.td,fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>{inv.invoice_date}</td>
              <td style={{...S.td,fontFamily:'var(--mono)',color:'var(--accent)'}}>${parseFloat(inv.total||0).toFixed(2)}</td>
              <td style={S.td}>{statusChip(inv.status)}</td>
            </tr>)}
            {results.length===0&&<tr><td colSpan={5} style={{padding:30,textAlign:'center',fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>No results</td></tr>}
          </tbody>
        </table>
      </div>
    </>}
  </div>;
}

// ─── SETTINGS PAGE ─────────────────────────────────────────────────
function SettingsPage({onReset,showToast}) {
  const [k,setK]=useState(getKey());const [saved,setSaved]=useState(false);
  const save=()=>{if(!k.startsWith('sk-ant-')){showToast('Invalid key','err');return;}setKey(k.trim());setSaved(true);setTimeout(()=>setSaved(false),2000);showToast('✓ API key saved!');};

  return <div style={{maxWidth:540}}>
    <div style={{...S.card,marginBottom:12}}>
      <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,marginBottom:12}}>ANTHROPIC API KEY</div>
      <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',lineHeight:1.8,marginBottom:12}}>Stored in this browser only — never in the code.<br/>Get yours at <span style={{color:'var(--accent)'}}>console.anthropic.com → API Keys</span></div>
      {getKey()&&<div style={{background:'rgba(82,201,122,.1)',border:'1px solid rgba(82,201,122,.3)',borderRadius:4,padding:'8px 12px',fontFamily:'var(--mono)',fontSize:11,color:'var(--green)',marginBottom:10}}>✓ API key active — AI invoice reading enabled</div>}
      <div style={{display:'flex',gap:8}}>
        <input type="password" style={{...S.input,fontFamily:'var(--mono)',fontSize:12,flex:1}} value={k} onChange={e=>setK(e.target.value)} placeholder="sk-ant-api03-…"/>
        <button onClick={save} style={{...S.btnPrimary,fontSize:14,padding:'8px 16px',letterSpacing:1}}>{saved?'SAVED ✓':'SAVE'}</button>
      </div>
    </div>
    <div style={{...S.card,marginBottom:12}}>
      <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,marginBottom:10}}>APP INFO</div>
      {[['App','InvoiceIntel'],['Hosted','choeunp4.github.io/invoiceintel'],['Database','Supabase (invoiceintel)'],['AI Model','Claude claude-opus-4-5']].map(([k,v])=>(
        <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)',fontFamily:'var(--mono)',fontSize:11}}>
          <span style={{color:'var(--text3)'}}>{k}</span><span style={{color:'var(--text2)'}}>{v}</span>
        </div>
      ))}
    </div>
    <div style={{background:'var(--bg2)',border:'1px solid var(--red)',borderRadius:6,padding:20}}>
      <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,color:'var(--red)',marginBottom:6}}>DANGER ZONE</div>
      <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',lineHeight:1.8,marginBottom:12}}>Clears all invoices and data from this session. Cannot be undone.</div>
      <button onClick={onReset} style={S.btnRed}>RESET ALL DATA</button>
    </div>
  </div>;
}

// ─── ALIASES PAGE ──────────────────────────────────────────────────
function AliasesPage({aliases,onDelete,onEdit,categories}) {
  const [search,setSearch] = useState('');
  const [editKey,setEditKey] = useState(null);
  const [editCat,setEditCat] = useState('');

  const entries = Object.values(aliases).filter(a=>
    !search || a.rawName.toLowerCase().includes(search.toLowerCase()) || a.category.toLowerCase().includes(search.toLowerCase())
  ).sort((a,b)=>a.rawName.localeCompare(b.rawName));

  if(Object.keys(aliases).length===0) return (
    <div style={{textAlign:'center',padding:60,color:'var(--text3)'}}>
      <div style={{fontSize:40,marginBottom:12}}>◈</div>
      <div style={{fontFamily:'var(--display)',fontSize:22,letterSpacing:2}}>NO ALIASES YET</div>
      <div style={{fontFamily:'var(--mono)',fontSize:10,marginTop:8,lineHeight:1.8}}>
        Aliases are saved automatically when you change a category<br/>during invoice review and approve the invoice.
      </div>
    </div>
  );

  return <div>
    <div style={{display:'flex',gap:10,marginBottom:16,alignItems:'center'}}>
      <input style={{...S.input,maxWidth:300}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by item name or category…"/>
      <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>{entries.length} alias{entries.length!==1?'es':''}</span>
    </div>
    <div style={S.tblWrap}>
      <table style={S.tbl}>
        <thead>
          <tr style={{background:'var(--bg3)',borderBottom:'1px solid var(--border)'}}>
            {['Item Name (Raw)','Category','Times Used','Date Saved',''].map(h=><th key={h} style={S.th}>{h}</th>)}
          </tr>
        </thead>
        <tbody>
          {entries.map(a=>(
            <tr key={a.rawName} style={{borderBottom:'1px solid var(--border)'}}>
              <td style={{...S.td,fontFamily:'var(--mono)',fontSize:11}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{width:6,height:6,borderRadius:'50%',background:'var(--blue)',flexShrink:0,display:'inline-block'}}/>
                  {a.rawName}
                </div>
              </td>
              <td style={S.td}>
                {editKey===a.rawName ? (
                  <div style={{display:'flex',gap:6,alignItems:'center'}}>
                    <select style={{...S.select,fontSize:11}} value={editCat} onChange={e=>setEditCat(e.target.value)}>
                      {categories.map(c=><option key={c}>{c}</option>)}
                      {!categories.includes(editCat)&&editCat&&<option>{editCat}</option>}
                    </select>
                    <button onClick={()=>{onEdit(a.rawName,editCat);setEditKey(null);}} style={{...S.btn,background:'var(--accent)',color:'#000',border:'none',padding:'4px 10px'}}>Save</button>
                    <button onClick={()=>setEditKey(null)} style={{...S.btnGhost,padding:'4px 8px'}}>✕</button>
                  </div>
                ) : (
                  <span style={{...S.chip('var(--blue)',''),fontFamily:'var(--mono)',fontSize:10}}>{a.category}</span>
                )}
              </td>
              <td style={{...S.td,fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>{a.count||1}</td>
              <td style={{...S.td,fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>{a.date||'—'}</td>
              <td style={{...S.td}}>
                <div style={{display:'flex',gap:6}}>
                  <button onClick={()=>{setEditKey(a.rawName);setEditCat(a.category);}} style={{...S.btnGhost,fontSize:10}}>Edit</button>
                  <button onClick={()=>{if(confirm(`Delete alias for "${a.rawName}"?`))onDelete(a.rawName);}} style={{...S.btnGhost,fontSize:10,color:'var(--red)',borderColor:'var(--red)'}}>Delete</button>
                </div>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  </div>;
}

// ─── APP ───────────────────────────────────────────────────────────
function App() {
  const [page,setPage]=useState('dashboard');
  const [invoices,setInvoices]=useState([]);
  const [categories,setCategories]=useState([]);
  const [aliases,setAliases]=useState({}); // {rawName: {category, canonical, count, date}}
  const [showUpload,setShowUpload]=useState(false);
  const [reviewInv,setReviewInv]=useState(null);
  const [toast,setToast]=useState(null);

  const showToast=(msg,type='')=>setToast({msg,type,id:Date.now()});
  const addCategory=cat=>setCategories(prev=>prev.includes(cat)?prev:[...prev,cat].sort());

  // Save/update alias — overwrites if exists
  const saveAlias=(rawName, category, canonical)=>{
    if(!rawName||!category) return;
    setAliases(prev=>({
      ...prev,
      [rawName.toLowerCase().trim()]:{
        rawName, category, canonical,
        count:(prev[rawName.toLowerCase().trim()]?.count||0)+1,
        date:new Date().toISOString().split('T')[0],
      }
    }));
  };

  const deleteAlias=rawName=>setAliases(prev=>{const n={...prev};delete n[rawName.toLowerCase().trim()];return n;});
  const lookupAlias=rawName=>aliases[rawName?.toLowerCase().trim()]||null;

  const pending=invoices.filter(i=>i.status==='pending').length;
  const pages={dashboard:'DASHBOARD',invoices:'INVOICES',items:'ITEMS & PRICES',query:'QUERY ENGINE',aliases:'ALIASES',settings:'SETTINGS'};

  const handleSubmit=inv=>{
    const ni={...inv,id:Date.now().toString(),status:'pending'};
    setInvoices(prev=>[ni,...prev]);
    setShowUpload(false);
    showToast(`Invoice ${inv.invoice_number} submitted for review!`);
    setPage('dashboard');
  };

  const handleSubmitMany=invs=>{
    const newInvs=invs.map((inv,i)=>({...inv,id:(Date.now()+i).toString(),status:'pending'}));
    setInvoices(prev=>[...newInvs,...prev]);
    setShowUpload(false);
    showToast(`${invs.length} invoices submitted for review!`);
    setPage('dashboard');
  };

  const handleApprove=(inv, changedLines)=>{
    // Silently save any manually changed categories as aliases
    if(changedLines){
      changedLines.forEach(l=>{
        if(l.name && l.category && l._categoryChanged){
          saveAlias(l.name, l.category, l.canonical||l.name);
          // Also add to categories list
          addCategory(l.category);
        }
      });
    }
    setInvoices(prev=>prev.map(i=>(i.id===inv.id)?{...inv,status:'approved'}:i));
    setReviewInv(null);
    showToast(`✓ Invoice ${inv.invoice_number} approved!`);
    sb.from('invoices').insert({invoice_number:inv.invoice_number,invoice_date:inv.invoice_date,total:inv.total,status:'approved',notes:inv.notes||null,file_name:inv.fileName||null}).catch(e=>console.log('Supabase:',e));
  };

  const handleReset=()=>{
    if(!confirm('Delete ALL data? Cannot be undone.'))return;
    setInvoices([]);setCategories([]);setAliases({});showToast('All data cleared');setPage('dashboard');
  };

  return <div style={S.app}>
    {/* SIDEBAR */}
    <div style={S.sidebar}>
      <div style={S.logo}>
        <div style={S.logoWord}>INVOICEINTEL</div>
        <div style={S.logoTag}>Food Cost Intelligence</div>
      </div>
      <nav style={{flex:1,paddingTop:8,overflowY:'auto'}}>
        <div style={S.navSec}>Overview</div>
        <NavItem icon="⬡" label="Dashboard" active={page==='dashboard'} onClick={()=>setPage('dashboard')}/>
        <NavItem icon="◫" label="Invoices" active={page==='invoices'} badge={pending} onClick={()=>setPage('invoices')}/>
        <div style={S.navSec}>Analysis</div>
        <NavItem icon="◉" label="Items & Prices" active={page==='items'} onClick={()=>setPage('items')}/>
        <NavItem icon="◎" label="Query Engine" active={page==='query'} onClick={()=>setPage('query')}/>
        <NavItem icon="◈" label="Aliases" active={page==='aliases'} onClick={()=>setPage('aliases')}/>
        <div style={S.navSec}>System</div>
        <NavItem icon="⚙" label="Settings" active={page==='settings'} onClick={()=>setPage('settings')}/>
      </nav>
      <div style={{padding:'12px 14px',borderTop:'1px solid var(--border)'}}>
        <button onClick={()=>setShowUpload(true)} style={{...S.btnPrimary,width:'100%',fontSize:15}}>+ NEW INVOICE</button>
        {!getKey()&&<div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--red)',textAlign:'center',marginTop:6}}>⚑ Add API key in Settings</div>}
      </div>
    </div>

    {/* MAIN */}
    <div style={S.main}>
      <div style={S.topbar}>
        <div style={S.pageTitle}>{pages[page]||page.toUpperCase()}</div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          {pending>0&&<span style={{background:'rgba(232,197,71,.12)',border:'1px solid var(--accent)',color:'var(--accent)',padding:'5px 12px',borderRadius:4,fontFamily:'var(--mono)',fontSize:11,cursor:'pointer'}} onClick={()=>setPage('invoices')}>⏳ {pending} PENDING</span>}
          <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>{invoices.filter(i=>i.status==='approved').length} invoices · ${invoices.filter(i=>i.status==='approved').reduce((s,i)=>s+(parseFloat(i.total)||0),0).toFixed(2)}</span>
        </div>
      </div>
      <div style={S.content}>
        {page==='dashboard'&&<Dashboard invoices={invoices} onReview={setReviewInv}/>}
        {page==='invoices'&&<InvoicesPage invoices={invoices} onReview={setReviewInv}/>}
        {page==='items'&&<ItemsPage invoices={invoices}/>}
        {page==='query'&&<QueryPage invoices={invoices}/>}
        {page==='aliases'&&<AliasesPage aliases={aliases} onDelete={deleteAlias} onEdit={(raw,cat)=>saveAlias(raw,cat,cat)} categories={categories}/>}
        {page==='settings'&&<SettingsPage onReset={handleReset} showToast={showToast}/>}
      </div>
    </div>

    {/* MODALS */}
    {showUpload&&<UploadModal onClose={()=>setShowUpload(false)} onSubmit={handleSubmit} onSubmitMany={handleSubmitMany} categories={categories} addCategory={addCategory} lookupAlias={lookupAlias}/>}
    {reviewInv&&<ReviewModal invoice={reviewInv} onClose={()=>setReviewInv(null)} onApprove={handleApprove} categories={categories} addCategory={addCategory} lookupAlias={lookupAlias}/>}

    {toast&&<div key={toast.id} style={{position:'fixed',bottom:22,right:22,background:'var(--bg3)',border:'1px solid var(--border2)',borderLeft:`3px solid ${toast.type==='err'?'var(--red)':toast.type==='warn'?'var(--accent)':'var(--green)'}`,borderRadius:4,padding:'10px 16px',fontFamily:'var(--mono)',fontSize:12,zIndex:999,maxWidth:320}} onClick={()=>setToast(null)}>{toast.msg}</div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
