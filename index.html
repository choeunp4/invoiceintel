// ─── AI ────────────────────────────────────────────────────────────
const AI_PROMPT=`Extract all data from this invoice. Return ONLY valid JSON, no markdown:
{"vendor":"name","invoice_number":"number or null","invoice_date":"YYYY-MM-DD or null","subtotal":0.00,"tax":0.00,"fees":0.00,"total":0.00,"line_items":[{"name":"exact name","quantity":1.0,"unit":"lb","unit_price":0.00,"line_total":0.00}]}
Rules: extract EVERY line item. unit_price=per unit. line_total=qty*unit_price. total=subtotal+tax+fees.`;

const COUNT_PROMPT=`Look at this PDF. Count how many SEPARATE invoices are in it. Each invoice has its own invoice number.
Return ONLY this JSON: {"count":1,"invoices":[{"invoice_number":"28443","vendor":"One Ocean","pages":"1"}]}`;

const MAX_CHUNK_MB=15;

async function callAI(base64,mimeType,apiKey,prompt=AI_PROMPT){
  const sizeMB=(base64.length*0.75)/(1024*1024);
  if(sizeMB>32)throw new Error(`File too large (${sizeMB.toFixed(1)}MB). Max 32MB.`);
  const isPDF=mimeType==='application/pdf';
  const content=isPDF
    ?[{type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},{type:'text',text:prompt}]
    :[{type:'image',source:{type:'base64',media_type:mimeType,data:base64}},{type:'text',text:prompt}];
  let res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-4-5',max_tokens:4096,messages:[{role:'user',content}]})
    });
  }catch(e){throw new Error('Network error — check connection and try again.');}
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(`API error ${res.status}: ${e.error?.message||'Unknown'}`);}
  const data=await res.json();
  const text=data.content?.[0]?.text||'';
  try{
    const clean=text.replace(/```json|```/g,'').trim();
    try{return JSON.parse(clean);}catch(e){}
    const arr=clean.match(/\[[\s\S]*\]/);
    const obj=clean.match(/\{[\s\S]*\}/);
    if(arr&&(!obj||arr[0].length>obj[0].length)){const r=JSON.parse(arr[0]);return Array.isArray(r)?r[0]:r;}
    if(obj)return JSON.parse(obj[0]);
    throw new Error('No JSON found');
  }catch(e){console.error('Parse error, raw:',text.substring(0,300));throw new Error('Could not parse AI response — try again');}
}

function fileToDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=()=>rej(new Error('Read failed'));r.readAsDataURL(file);});}

// ─── PDF BLOB URL HOOK ─────────────────────────────────────────────
function usePdfBlobUrl(dataUrl,active){
  const [url,setUrl]=useState(null);
  useEffect(()=>{
    if(!active||!dataUrl)return;
    try{
      const b64=dataUrl.split(',')[1];
      const bin=atob(b64);const buf=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
      const blob=new Blob([buf],{type:'application/pdf'});
      const u=URL.createObjectURL(blob);
      setUrl(u);
      return()=>URL.revokeObjectURL(u);
    }catch(e){console.error('PDF blob:',e);}
  },[dataUrl,active]);
  return url;
}

}

// ─── PDF SPLITTING ─────────────────────────────────────────────────
function parsePageStr(s,total){
  if(!s)return Array.from({length:total},(_,i)=>i);
  const idx=new Set();
  s.split(',').forEach(p=>{const r=p.trim().split('-');if(r.length===2){for(let i=parseInt(r[0])-1;i<parseInt(r[1]);i++)idx.add(i);}else idx.add(parseInt(r[0])-1);});
  return[...idx].filter(i=>i>=0&&i<total);
}
async function splitPDF(arrayBuffer,groups){
  const{PDFDocument}=PDFLib;
  const src=await PDFDocument.load(arrayBuffer);
  const chunks=[];
  for(const g of groups){
    const pdf=await PDFDocument.create();
    const pages=await pdf.copyPages(src,g.pages);
    pages.forEach(p=>pdf.addPage(p));
    const bytes=await pdf.save();
    const b64=btoa(String.fromCharCode(...new Uint8Array(bytes)));
    chunks.push({base64:b64,dataUrl:`data:application/pdf;base64,${b64}`,pageNumbers:g.pages.map(i=>i+1)});
  }
  return chunks;
}

function LoginScreen({onLogin}){
  const [mode,setMode]=useState('login'); // login|signup|pin
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [pin,setPin]=useState('');
  const [pinInput,setPinInput]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const [pinUser,setPinUser]=useState(null);

  // Check for stored PIN users
  const [pinUsers,setPinUsers]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('ii_pin_users')||'[]');}catch{return[];}
  });

  const handleEmailLogin=async()=>{
    setLoading(true);setErr('');
    const{data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){setErr(error.message);setLoading(false);return;}
    onLogin(data.user);
  };

  const handleSignup=async()=>{
    setLoading(true);setErr('');
    const{data,error}=await sb.auth.signUp({email,password,options:{data:{role:'viewer'}}});
    if(error){setErr(error.message);setLoading(false);return;}
    setErr('Check your email to confirm your account, then log in.');
    setMode('login');setLoading(false);
  };

  const handleGoogle=async()=>{
    setErr('');
    const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href}});
    if(error)setErr(error.message);
  };

  const handlePinLogin=async(p)=>{
    const code=p||pinInput;
    const stored=pinUsers.find(u=>u.pin===code);
    if(!stored){setErr('Invalid PIN');return;}
    // Sign in with stored credentials
    const{data,error}=await sb.auth.signInWithPassword({email:stored.email,password:stored.password});
    if(error){setErr('PIN login failed — try email login');return;}
    onLogin(data.user);
  };

  const handlePinDigit=d=>{
    const next=pinInput+d;
    setPinInput(next);
    if(next.length===4)handlePinLogin(next);
  };

          {err&&<div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',marginBottom:8}}>{err}</div>}
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,maxWidth:200,margin:'0 auto'}}>
            {[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map((d,i)=><button key={i} onClick={()=>{if(d==='⌫')setPinInput(p=>p.slice(0,-1));else if(d!=='')handlePinDigit(String(d));}} style={{...S.btn,padding:'12px',fontSize:18,fontFamily:'var(--display)',letterSpacing:1,opacity:d===''?0:1,cursor:d===''?'default':'pointer'}} disabled={d===''}>
              {d}
            </button>)}
          </div>
          <button onClick={()=>setPinUsers([])} style={{...S.btnGhost,fontSize:10,marginTop:12}}>Use email instead</button>
        </div>
      )}

      {(pinUsers.length===0||mode!=='login')&&<>
        {err&&<div style={{background:'rgba(224,82,82,.12)',border:'1px solid var(--red)',borderRadius:4,padding:'8px 12px',fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',marginBottom:12}}>{err}</div>}

        <div style={{...S.card,marginBottom:12}}>
          <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:2,marginBottom:14}}>{mode==='signup'?'CREATE ACCOUNT':'SIGN IN'}</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <div><label style={S.label}>Email</label><input style={S.input} type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(mode==='signup'?handleSignup():handleEmailLogin())} placeholder="your@email.com"/></div>
            <div><label style={S.label}>Password</label><input style={S.input} type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(mode==='signup'?handleSignup():handleEmailLogin())} placeholder="••••••••"/></div>
          </div>
          <button onClick={mode==='signup'?handleSignup:handleEmailLogin} disabled={loading} style={{...S.btnPrimary,width:'100%',marginTop:14,fontSize:16,letterSpacing:2}}>
            {loading?'…':mode==='signup'?'CREATE ACCOUNT':'SIGN IN'}
          </button>
          <div style={{textAlign:'center',marginTop:10}}>
            <button onClick={()=>{setMode(mode==='signup'?'login':'signup');setErr('');}} style={{background:'none',border:'none',color:'var(--text3)',fontFamily:'var(--mono)',fontSize:10,cursor:'pointer'}}>
              {mode==='signup'?'Already have an account? Sign in':'No account? Create one'}
            </button>
          </div>
        </div>

        <button onClick={handleGoogle} style={{...S.btn,width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:10,padding:'10px',fontSize:12}}>
          <span>G</span> Continue with Google
        </button>
      </>}
    </div>
  </div>;
}

// ─── PIN SETUP MODAL ───────────────────────────────────────────────
function PinSetupModal({user,email,password,onDone,onSkip}){
  const [pin,setPin]=useState('');
  const [confirm,setConfirm]=useState('');
  const [step,setStep]=useState('set'); // set|confirm
  const [err,setErr]=useState('');

  const handleDigit=d=>{
    if(step==='set'){
      const next=pin+d;
      setPin(next);
      if(next.length===4)setStep('confirm');
    } else {
      const next=confirm+d;
      setConfirm(next);
      if(next.length===4){
        if(next===pin){
          // Save PIN user
          const existing=JSON.parse(localStorage.getItem('ii_pin_users')||'[]');
          const updated=existing.filter(u=>u.email!==email);
          updated.push({email,password,pin:next,name:user?.user_metadata?.full_name||email});
          localStorage.setItem('ii_pin_users',JSON.stringify(updated));
          onDone();
        } else {
          setErr('PINs do not match — try again');
          setPin('');setConfirm('');setStep('set');
        }
      }
    }
  };

  const current=step==='set'?pin:confirm;

  return <div style={S.overlay}>
    <div style={{...S.modal,width:340}}>
      <div style={S.modalHdr}>
        <div style={S.modalTitle}>SET YOUR PIN</div>
      </div>
      <div style={{padding:24,textAlign:'center'}}>
        <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)',marginBottom:20,lineHeight:1.8}}>
          {step==='set'?'Choose a 4-digit PIN for quick daily login':'Enter the same PIN to confirm'}
        </div>
        <div style={{display:'flex',justifyContent:'center',gap:10,marginBottom:20}}>
          {[0,1,2,3].map(i=><div key={i} style={{width:16,height:16,borderRadius:'50%',background:current.length>i?'var(--accent)':'var(--bg3)',border:'1px solid var(--border2)'}}/>)}
        </div>
        {err&&<div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',marginBottom:12}}>{err}</div>}
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,maxWidth:220,margin:'0 auto 16px'}}>
          {[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map((d,i)=><button key={i} onClick={()=>{if(d==='⌫'){step==='set'?setPin(p=>p.slice(0,-1)):setConfirm(p=>p.slice(0,-1));}else if(d!=='')handleDigit(String(d));}} style={{...S.btn,padding:'14px',fontSize:20,fontFamily:'var(--display)',letterSpacing:1,opacity:d===''?0:1}} disabled={d===''}>
            {d}
          </button>)}
        </div>
        <button onClick={onSkip} style={{...S.btnGhost,fontSize:10}}>Skip — use email login each time</button>
      </div>
    </div>
  </div>;
}

// ─── UPLOAD MODAL ──────────────────────────────────────────────────
function UploadModal({onClose,onSubmit,onSubmitMany,categories,addCategory,lookupAlias,isAdmin}){
  const [step,setStep]=useState('drop');
  const [fileData,setFileData]=useState(null);
  const [countData,setCountData]=useState(null);
  const [err,setErr]=useState('');
  const [aiStatus,setAiStatus]=useState('');
  const [vendor,setVendor]=useState('');
  const [num,setNum]=useState('');
  const [date,setDate]=useState(new Date().toISOString().split('T')[0]);
  const [subtotal,setSubtotal]=useState('');
  const [tax,setTax]=useState('');
  const [fees,setFees]=useState('');
  const [grand,setGrand]=useState('');
  const [notes,setNotes]=useState('');
  const [lines,setLines]=useState([]);
  const [showPreview,setShowPreview]=useState(false);
  const dropRef=useRef();

  const enrich=items=>(items||[]).map(li=>{
    const alias=lookupAlias&&lookupAlias(li.name);
    if(alias){if(!categories.includes(alias.category))addCategory(alias.category);return{...li,id:Math.random().toString(36).slice(2),category:alias.category,canonical:alias.canonical||li.name,_fromAlias:true};}
    const m=matchItem(li.name);
    if(m&&!categories.includes(m.cat))addCategory(m.cat);
    return{...li,id:Math.random().toString(36).slice(2),category:m?.cat||'',canonical:m?.name||li.name,_fromAlias:false};
  });

  const handleFile=async file=>{
    if(!getApiKey()){setErr('No API key — go to Settings');return;}
    setErr('');
    const dataUrl=await fileToDataUrl(file);
    const fd={dataUrl,name:file.name,mimeType:file.type};
    setFileData(fd);
    const base64=dataUrl.split(',')[1];
    const isPDF=file.type==='application/pdf';
    const sizeMB=file.size/(1024*1024);

    if(isPDF&&sizeMB>MAX_CHUNK_MB){
      setStep('counting');setAiStatus(`Large file (${sizeMB.toFixed(1)}MB) — analyzing…`);
      try{
        const cr=await callAI(base64,file.type,getApiKey(),COUNT_PROMPT);
        if(cr.count>1){
          const ab=await file.arrayBuffer();
          const{PDFDocument}=PDFLib;
          const src=await PDFDocument.load(ab);
          const total=src.getPageCount();
          const groups=(cr.invoices||[]).map(inv=>({pages:parsePageStr(inv.pages,total),invoice_number:inv.invoice_number,vendor:inv.vendor}));
          const chunks=await splitPDF(ab,groups);
          setCountData({count:cr.count,invoices:cr.invoices||[],chunks});
          setStep('confirm');return;
        }
      }catch(e){setErr('Split error: '+e.message);}
      await readSingle(base64,file.type);return;
    }

    if(isPDF){
      setStep('counting');setAiStatus('Counting invoices…');
      try{
        const cr=await callAI(base64,file.type,getApiKey(),COUNT_PROMPT);
        if(cr.count>1){setCountData({count:cr.count,invoices:cr.invoices||[],chunks:null});setStep('confirm');return;}
      }catch(e){console.log('Count failed:',e.message);}
    }
    await readSingle(base64,file.type);
  };

  const readSingle=async(base64,mimeType)=>{
    setStep('ai');setAiStatus('Reading invoice…');
    try{
      const p=await callAI(base64,mimeType,getApiKey(),AI_PROMPT);
      setVendor(p.vendor||'');setNum(p.invoice_number||'');
      setDate(p.invoice_date||new Date().toISOString().split('T')[0]);
      setSubtotal(String(p.subtotal||''));setTax(String(p.tax||''));
      setFees(String(p.fees||''));setGrand(String(p.total||''));
      setLines(enrich(p.line_items));setStep('form');
    }catch(e){setErr('AI error: '+e.message);setLines([{id:'1',name:'',category:'',quantity:'',unit:'lb',unit_price:'',line_total:'',_fromAlias:false}]);setStep('form');}
  };

  const readMultiple=async()=>{
    setStep('ai');
    const base64=fileData.dataUrl.split(',')[1];
    if(countData.chunks){
      const all=[];
      for(let i=0;i<countData.chunks.length;i++){
        const chunk=countData.chunks[i];
        setAiStatus(`Reading invoice ${i+1} of ${countData.chunks.length}…`);
        try{
          const r=await callAI(chunk.base64,'application/pdf',getApiKey(),AI_PROMPT);
          const inv=Array.isArray(r)?r[0]:r;
          all.push({...inv,line_items:enrich(inv.line_items),fileDataUrl:fileData.dataUrl,fileName:fileData.name,fileType:fileData.mimeType,pages:chunk.pageNumbers?.join(',')});
        }catch(e){all.push({vendor:'',invoice_number:`CHUNK-${i+1}`,invoice_date:new Date().toISOString().split('T')[0],subtotal:0,tax:0,fees:0,total:0,line_items:[],fileDataUrl:fileData.dataUrl,fileName:fileData.name,fileType:fileData.mimeType});}
      }
      onSubmitMany(all);return;
    }
    const all=[];
    for(let i=0;i<countData.count;i++){
      const inv=countData.invoices[i]||{};
      setAiStatus(`Reading invoice ${i+1} of ${countData.count}: ${inv.invoice_number||''}…`);
      const p=`Extract data for invoice number "${inv.invoice_number||`Invoice ${i+1}`}"${inv.pages?` on page(s) ${inv.pages}`:''} from this PDF. Ignore all other invoices. Return ONLY valid JSON:
{"vendor":"name","invoice_number":"${inv.invoice_number||''}","invoice_date":"YYYY-MM-DD","subtotal":0.00,"tax":0.00,"fees":0.00,"total":0.00,"line_items":[{"name":"exact name","quantity":1.0,"unit":"lb","unit_price":0.00,"line_total":0.00}]}
Extract EVERY line item for this invoice only.`;
      try{
        const r=await callAI(base64,fileData.mimeType,getApiKey(),p);
        const parsed=Array.isArray(r)?r[0]:r;
        all.push({...parsed,line_items:enrich(parsed.line_items),fileDataUrl:fileData.dataUrl,fileName:fileData.name,fileType:fileData.mimeType,pages:inv.pages||''});
      }catch(e){all.push({vendor:inv.vendor||'',invoice_number:inv.invoice_number||`INV-${i+1}`,invoice_date:new Date().toISOString().split('T')[0],subtotal:0,tax:0,fees:0,total:0,line_items:[],fileDataUrl:fileData.dataUrl,fileName:fileData.name,fileType:fileData.mimeType});}
    }
    onSubmitMany(all);
  };

  const updL=(id,f,v)=>setLines(prev=>prev.map(l=>l.id===id?{...l,[f]:v}:l));
  const remL=id=>setLines(prev=>prev.filter(l=>l.id!==id));
  const addL=()=>setLines(prev=>[...prev,{id:Math.random().toString(36).slice(2),name:'',category:'',quantity:'',unit:'lb',unit_price:'',line_total:'',_fromAlias:false}]);
  const calc=(parseFloat(subtotal)||0)+(parseFloat(tax)||0)+(parseFloat(fees)||0);
  const match=grand&&Math.abs(calc-parseFloat(grand))<0.02;

  const submit=()=>{
    if(!vendor.trim()){setErr('Vendor required');return;}
    onSubmit({vendor:vendor.trim(),invoice_number:num||Date.now().toString(),invoice_date:date,subtotal:parseFloat(subtotal)||0,tax:parseFloat(tax)||0,fees:parseFloat(fees)||0,total:parseFloat(grand)||calc,notes,line_items:lines,fileDataUrl:fileData?.dataUrl||null,fileName:fileData?.name||null,fileType:fileData?.mimeType||null});
  };

  const titles={drop:'NEW INVOICE',counting:'CHECKING PDF…',confirm:'MULTIPLE INVOICES FOUND',ai:'READING INVOICE…',form:'REVIEW INVOICE'};

  return <div style={S.overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div style={{...S.modal,width:'96%',maxWidth:step==='form'?1060:540,maxHeight:'94vh'}}>
      <div style={S.modalHdr}>
        <div style={S.modalTitle}>{titles[step]||'NEW INVOICE'}</div>
        <button onClick={onClose} style={{background:'none',border:'1px solid var(--border2)',color:'var(--text2)',width:28,height:28,borderRadius:4,fontSize:13,cursor:'pointer'}}>✕</button>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:20}}>
        {err&&<div style={{background:'rgba(224,82,82,.12)',border:'1px solid var(--red)',borderRadius:4,padding:'8px 12px',fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',marginBottom:12}}>{err}</div>}

        {step==='drop'&&<div ref={dropRef} onDragOver={e=>{e.preventDefault();dropRef.current.style.borderColor='var(--accent)';}} onDragLeave={()=>dropRef.current.style.borderColor='var(--border2)'} onDrop={e=>{e.preventDefault();dropRef.current.style.borderColor='var(--border2)';const f=e.dataTransfer.files[0];if(f)handleFile(f);}} onClick={()=>document.getElementById('_fp').click()} style={{border:'2px dashed var(--border2)',borderRadius:8,padding:52,textAlign:'center',cursor:'pointer',transition:'border-color .2s'}}>
          <div style={{fontSize:44,marginBottom:12}}>📄</div>
          <div style={{fontFamily:'var(--display)',fontSize:22,letterSpacing:2,color:'var(--text2)',marginBottom:8}}>DROP INVOICE HERE</div>
          <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>PDF · JPG · PNG</div>
          <input id="_fp" type="file" accept="image/*,.pdf" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(f)handleFile(f);}}/>
        </div>}

        {(step==='counting'||step==='ai')&&<div style={{textAlign:'center',padding:44}}>
          <div style={{width:40,height:40,border:'2px solid var(--border2)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin .7s linear infinite',margin:'0 auto 16px'}}/>
          <div style={{fontFamily:'var(--display)',fontSize:22,letterSpacing:2,color:'var(--accent)',marginBottom:8}}>{aiStatus}</div>
          {fileData&&<div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',marginTop:6}}>📎 {fileData.name}</div>}
        </div>}

        {step==='confirm'&&countData&&<div>
          <div style={{background:'rgba(232,197,71,.08)',border:'1px solid rgba(232,197,71,.3)',borderRadius:6,padding:16,marginBottom:20}}>
            <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,color:'var(--accent)',marginBottom:8}}>{countData.count} INVOICES DETECTED</div>
            <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)',marginBottom:14}}>Split into {countData.count} separate review cards?</div>
            {countData.invoices.map((inv,i)=><div key={i} style={{padding:'7px 12px',background:'var(--bg3)',borderRadius:4,marginBottom:5,fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)',display:'flex',gap:12}}>
              <span style={{color:'var(--accent)'}}>#inv{i+1}</span>
              {inv.invoice_number&&<span>{inv.invoice_number}</span>}
              {inv.vendor&&<span style={{color:'var(--text3)'}}>{inv.vendor}</span>}
              {inv.pages&&<span style={{color:'var(--text3)',marginLeft:'auto'}}>p.{inv.pages}</span>}
            </div>)}
          </div>
          <div style={{display:'flex',gap:12}}>
            <button onClick={readMultiple} style={{...S.btnPrimary,flex:1,fontSize:14,letterSpacing:1}}>YES — SPLIT INTO {countData.count} INVOICES</button>
            <button onClick={()=>readSingle(fileData.dataUrl.split(',')[1],fileData.mimeType)} style={{...S.btn,flex:1,textAlign:'center'}}>No — treat as one</button>
          </div>
        </div>}

        {step==='form'&&<div style={{display:'flex',gap:20,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:280}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
              <div><label style={S.label}>Vendor *</label><input style={S.input} value={vendor} onChange={e=>setVendor(e.target.value)}/></div>
              <div><label style={S.label}>Invoice #</label><input style={S.input} value={num} onChange={e=>setNum(e.target.value)}/></div>
              <div><label style={S.label}>Date</label><input type="date" style={S.input} value={date} onChange={e=>setDate(e.target.value)}/></div>
              <div><label style={S.label}>Notes</label><input style={S.input} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional"/></div>
            </div>
            <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:2,textTransform:'uppercase',marginBottom:8}}>Line Items ({lines.length})</div>
            <div style={{overflowX:'auto'}}><div style={{minWidth:480}}>
              <div style={{display:'grid',gridTemplateColumns:'2fr 1.2fr .55fr .55fr .85fr .85fr 24px',gap:5,marginBottom:5}}>
                {['Item','Category','Qty','Unit','Unit $','Total',''].map(h=><div key={h} style={{fontFamily:'var(--mono)',fontSize:8,color:'var(--text3)',letterSpacing:1,textTransform:'uppercase'}}>{h}</div>)}
              </div>
              <div style={{maxHeight:240,overflowY:'auto'}}>
                {lines.map(l=><div key={l.id} style={{display:'grid',gridTemplateColumns:'2fr 1.2fr .55fr .55fr .85fr .85fr 24px',gap:5,marginBottom:5,alignItems:'center'}}>
                  <input style={{...S.input,fontSize:11,padding:'5px 8px'}} value={l.name} onChange={e=>updL(l.id,'name',e.target.value)} placeholder="Item"/>
                  <CatSelect value={l.category} categories={categories} onChange={v=>{updL(l.id,'category',v);if(v&&!categories.includes(v))addCategory(v);}}/>
                  <input style={{...S.input,fontSize:11,padding:'5px 6px',textAlign:'center'}} type="number" value={l.quantity} onChange={e=>updL(l.id,'quantity',e.target.value)}/>
                  <select style={{...S.select,fontSize:10,padding:'5px 6px'}} value={l.unit||'lb'} onChange={e=>updL(l.id,'unit',e.target.value)}>
                    {['lb','kg','case','each','oz','gallon','qt','dozen'].map(u=><option key={u}>{u}</option>)}
                  </select>
                  <input style={{...S.input,fontSize:11,padding:'5px 6px',fontFamily:'var(--mono)'}} type="number" step="0.01" value={l.unit_price} onChange={e=>updL(l.id,'unit_price',e.target.value)}/>
                  <input style={{...S.input,fontSize:11,padding:'5px 6px',fontFamily:'var(--mono)',background:'var(--bg4)'}} type="number" step="0.01" value={l.line_total} onChange={e=>updL(l.id,'line_total',e.target.value)}/>
                  <button onClick={()=>remL(l.id)} style={{background:'none',border:'1px solid var(--border2)',color:'var(--text3)',width:22,height:22,borderRadius:3,fontSize:11,cursor:'pointer',padding:0}}>✕</button>
                </div>)}
              </div>
            </div></div>
            <button onClick={addL} style={{width:'100%',border:'1px dashed var(--border2)',background:'none',color:'var(--text3)',padding:6,borderRadius:4,fontFamily:'var(--mono)',fontSize:11,cursor:'pointer',marginTop:4}}>+ Add Line</button>
            <div style={{background:'var(--bg3)',borderRadius:4,padding:'12px 14px',marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
              {[['Subtotal',subtotal,setSubtotal],['Tax',tax,setTax],['Fees',fees,setFees]].map(([lbl,v,set])=><div key={lbl}>
                <label style={S.label}>{lbl}</label>
                <div style={{display:'flex',alignItems:'center',gap:3}}><span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>$</span><input style={{...S.input,fontFamily:'var(--mono)',fontSize:11}} type="number" step="0.01" value={v} onChange={e=>set(e.target.value)} placeholder="0.00"/></div>
              </div>)}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:10,flexWrap:'wrap',gap:10}}>
              <div><label style={S.label}>Grand Total</label>
                <div style={{display:'flex',alignItems:'center',gap:3}}><span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>$</span><input style={{...S.input,fontFamily:'var(--mono)',fontSize:13,border:'1px solid var(--accent)',width:150}} type="number" step="0.01" value={grand} onChange={e=>setGrand(e.target.value)} placeholder="0.00"/></div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:1,marginBottom:4}}>CALCULATED</div>
                <div style={{fontFamily:'var(--display)',fontSize:22,color:'var(--accent)'}}>${calc.toFixed(2)}</div>
                {grand&&<div style={{fontFamily:'var(--mono)',fontSize:10,color:match?'var(--green)':'var(--red)',marginTop:2}}>{match?'✓ Match':'⚑ Diff: $'+Math.abs(calc-parseFloat(grand)).toFixed(2)}</div>}
              </div>
            </div>
          </div>
          <div style={{width:240,flexShrink:0,minWidth:200}}>
            <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--text3)',letterSpacing:2,textTransform:'uppercase',marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              Invoice Preview
              <button onClick={()=>setShowPreview(!showPreview)} style={{...S.btnGhost,fontSize:10,padding:'2px 8px'}}>{showPreview?'Hide':'Show'}</button>
            </div>
            {showPreview&&fileData?<InvoiceViewer dataUrl={fileData.dataUrl} mimeType={fileData.mimeType} fileName={fileData.name} height={340}/>
            :<div style={{border:'1px solid var(--border2)',borderRadius:6,padding:20,textAlign:'center'}}>
              <div style={{fontSize:28,marginBottom:8}}>📄</div>
              <div style={{fontFamily:'var(--mono)',fontSize:10,color:fileData?'var(--green)':'var(--text3)'}}>{fileData?'✓ '+fileData.name:'No file'}</div>
              {fileData&&<div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',marginTop:4}}>Click "Show" to preview</div>}
            </div>}
          </div>
        </div>}
      </div>
      {step==='form'&&<div style={S.modalFoot}>
        <button onClick={onClose} style={S.btn}>Cancel</button>
        <button onClick={submit} style={S.btnPrimary}>SUBMIT FOR REVIEW →</button>
      </div>}
    </div>
  </div>;
}

function ReviewModal({invoice,onClose,onApprove,categories,addCategory,lookupAlias}){

  const remL=id=>setLines(prev=>prev.filter(l=>l.id!==id));

// ─── ITEMS PAGE ────────────────────────────────────────────────────
function ItemsPage({invoices}){
  const [cat,setCat]=useState('');
  const map={};
  invoices.filter(i=>i.status==='approved').forEach(inv=>{
    (inv.line_items||[]).forEach(li=>{
      const key=li.canonical||li.name;if(!key)return;
      if(!map[key])map[key]={name:key,cat:li.category||'Other',vendors:{}};
      if(li.unit_price&&parseFloat(li.unit_price)>0){
        if(!map[key].vendors[inv.vendor])map[key].vendors[inv.vendor]=[];
        map[key].vendors[inv.vendor].push({price:parseFloat(li.unit_price),unit:li.unit||'lb',date:inv.invoice_date});
      }
    });
  });
  const items=Object.values(map);
  const cats=[...new Set(items.map(i=>i.cat))].sort();
  const filtered=cat?items.filter(i=>i.cat===cat):items;
  const grouped={};filtered.forEach(i=>{if(!grouped[i.cat])grouped[i.cat]=[];grouped[i.cat].push(i);});

  if(!items.length)return <div style={{textAlign:'center',padding:60,color:'var(--text3)'}}>
    <div style={{fontSize:40,marginBottom:12}}>📊</div>
    <div style={{fontFamily:'var(--display)',fontSize:22,letterSpacing:2}}>NO DATA YET</div>
    <div style={{fontFamily:'var(--mono)',fontSize:10,marginTop:8}}>Approve invoices to see price comparisons</div>
  </div>;

  return <div>
    <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
      <button style={{...S.btn,...(cat===''?{background:'var(--accent)',color:'#000',borderColor:'var(--accent)'}:{})}} onClick={()=>setCat('')}>All</button>
      {cats.map(c=><button key={c} style={{...S.btn,...(cat===c?{background:'var(--accent)',color:'#000',borderColor:'var(--accent)'}:{})}} onClick={()=>setCat(c)}>{c}</button>)}
    </div>
    {Object.entries(grouped).map(([g,gi])=><div key={g} style={{marginBottom:24}}>
      <div style={{fontFamily:'var(--display)',fontSize:16,letterSpacing:2,color:'var(--text2)',borderBottom:'1px solid var(--border)',paddingBottom:6,marginBottom:10}}>{g} <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>({gi.length})</span></div>
      {gi.map(item=>{
        const [open,setOpen]=useState(false);
        const ve=Object.entries(item.vendors);
        const prices=ve.flatMap(([,ps])=>ps.map(p=>p.price));
        const best=prices.length?Math.min(...prices):null;
        return <div key={item.name} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:6,marginBottom:8,overflow:'hidden'}}>
          <div onClick={()=>setOpen(!open)} style={{padding:'10px 14px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',background:open?'var(--bg3)':'var(--bg2)'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontFamily:'var(--display)',fontSize:17,letterSpacing:1}}>{item.name}</span>
              <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>{ve.length} vendor{ve.length>1?'s':''}</span>
            </div>
            <div style={{display:'flex',gap:12,alignItems:'center'}}>
              {best&&<span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--accent)'}}>Best: ${best.toFixed(2)}</span>}
              <span style={{color:'var(--text3)'}}>{open?'▲':'▾'}</span>
            </div>
          </div>
          {open&&<div style={{padding:'10px 14px',borderTop:'1px solid var(--border)'}}>
            {ve.map(([v,ps])=>{
              const latest=ps.sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
              const isBest=latest?.price===best;
              return <div key={v} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid var(--border)'}}>
                <span style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>{v}</span>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span style={{fontFamily:'var(--mono)',fontSize:13,color:isBest?'var(--green)':'var(--text)'}}>${latest?.price?.toFixed(2)}/{latest?.unit}{isBest&&<span style={{marginLeft:6,fontSize:10}}> ★ BEST</span>}</span>
                  {!isBest&&best&&<span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--red)'}}>+${(latest?.price-best).toFixed(2)} vs best</span>}
                  <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>{ps.length} order{ps.length>1?'s':''}</span>
                </div>
              </div>;
            })}
          </div>}
        </div>;
      })}
    </div>)}
  </div>;
}

// ─── QUERY PAGE ────────────────────────────────────────────────────
function QueryPage({invoices}){
  const [vendor,setVendor]=useState('');const [from,setFrom]=useState('');const [to,setTo]=useState('');const [status,setStatus]=useState('');const [results,setResults]=useState(null);
  const vendors=[...new Set(invoices.map(i=>i.vendor))].sort();
  const run=()=>{let r=[...invoices];if(vendor)r=r.filter(i=>i.vendor===vendor);if(from)r=r.filter(i=>i.invoice_date>=from);if(to)r=r.filter(i=>i.invoice_date<=to);if(status)r=r.filter(i=>i.status===status);setResults(r);};
  const total=results?.reduce((s,i)=>s+(parseFloat(i.total)||0),0)||0;
  const vb={};results?.forEach(i=>{vb[i.vendor]=(vb[i.vendor]||0)+(parseFloat(i.total)||0);});
  return <div>
    <div style={{...S.card,border:'1px solid var(--accent)',marginBottom:20}}>
      <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,color:'var(--accent)',marginBottom:14}}>CUSTOM QUERY</div>

        <div><label style={S.label}>Status</label><select style={{...S.select,width:'100%'}} value={status} onChange={e=>setStatus(e.target.value)}><option value="">All</option><option>approved</option><option>pending</option></select></div>

      <div style={S.statGrid}>

      <div style={S.tblWrap}>
        <table style={S.tbl}>
          <thead><tr style={{background:'var(--bg3)',borderBottom:'1px solid var(--border)'}}>{['Invoice #','Vendor','Date','Total','Status'].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
          <tbody>
            {results.map(inv=><tr key={inv.id} style={{borderBottom:'1px solid var(--border)'}}>
              <td style={{...S.td,fontFamily:'var(--mono)',fontSize:12}}>{inv.invoice_number}</td>
              <td style={{...S.td,fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>{inv.vendor}</td>
              <td style={{...S.td,fontFamily:'var(--mono)',fontSize:11,color:'var(--text2)'}}>{inv.invoice_date}</td>
              <td style={{...S.td,fontFamily:'var(--mono)',color:'var(--accent)'}}>${parseFloat(inv.total||0).toFixed(2)}</td>

function AdminPanel({showToast}){
  const [users,setUsers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [newEmail,setNewEmail]=useState('');
  const [newRole,setNewRole]=useState('viewer');
  const [newPwd,setNewPwd]=useState('');
  const [err,setErr]=useState('');

  useEffect(()=>{
    sb.from('profiles').select('*').order('created_at').then(({data})=>{ if(data)setUsers(data); setLoading(false); });
  },[]);

  const updateRole=async(id,role)=>{
    const{error}=await sb.from('profiles').update({role}).eq('id',id);
    if(error){showToast('Error: '+error.message,'err');return;}
    setUsers(prev=>prev.map(u=>u.id===id?{...u,role}:u));
    showToast('Role updated!');
  };

  const createUser=async()=>{
    if(!newEmail||!newPwd){setErr('Email and password required');return;}
    setErr('');
    // Use admin API via Supabase edge function or just sign up normally
    const{data,error}=await sb.auth.signUp({email:newEmail,password:newPwd,options:{data:{role:newRole}}});
    if(error){setErr(error.message);return;}
    // Update role in profiles
    if(data.user){
      await sb.from('profiles').upsert({id:data.user.id,email:newEmail,role:newRole});
    }
    showToast(`User ${newEmail} created as ${newRole}!`);
    setNewEmail('');setNewPwd('');
    // Refresh users
    const{data:ud}=await sb.from('profiles').select('*').order('created_at');
    if(ud)setUsers(ud);
  };

  if(loading)return <div style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)',padding:20}}>Loading users…</div>;

  return <div>
    <div style={{...S.card,marginBottom:20}}>
      <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,marginBottom:14}}>CREATE NEW USER</div>
      {err&&<div style={{background:'rgba(224,82,82,.12)',border:'1px solid var(--red)',borderRadius:4,padding:'8px 12px',fontFamily:'var(--mono)',fontSize:11,color:'var(--red)',marginBottom:10}}>{err}</div>}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr auto',gap:10,alignItems:'end'}}>
        <div><label style={S.label}>Email</label><input style={S.input} type="email" value={newEmail} onChange={e=>setNewEmail(e.target.value)} placeholder="user@email.com"/></div>
        <div><label style={S.label}>Password</label><input style={S.input} type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)} placeholder="Min 8 chars"/></div>
        <div><label style={S.label}>Role</label><select style={{...S.select,width:'100%'}} value={newRole} onChange={e=>setNewRole(e.target.value)}><option value="viewer">Viewer</option><option value="admin">Admin</option></select></div>
        <button onClick={createUser} style={{...S.btnPrimary,fontSize:14,padding:'8px 18px',letterSpacing:1,whiteSpace:'nowrap'}}>CREATE</button>
      </div>
    </div>
    <div style={{fontFamily:'var(--display)',fontSize:18,letterSpacing:2,marginBottom:12}}>ALL USERS</div>
    <div style={S.tblWrap}>
      <table style={S.tbl}>
        <thead><tr style={{background:'var(--bg3)',borderBottom:'1px solid var(--border)'}}>{['Email','Role','Created',''].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
        <tbody>
          {users.map(u=><tr key={u.id} style={{borderBottom:'1px solid var(--border)'}}>
            <td style={{...S.td,fontFamily:'var(--mono)',fontSize:11}}>{u.email}</td>
            <td style={S.td}>
              <select value={u.role} onChange={e=>updateRole(u.id,e.target.value)} style={{...S.select,fontSize:11,padding:'4px 8px'}}>
                <option value="viewer">Viewer</option>
                <option value="admin">Admin</option>
              </select>
            </td>
            <td style={{...S.td,fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>{u.created_at?.split('T')[0]}</td>
            <td style={S.td}>{chip(u.role==='admin'?'var(--accent)':'var(--blue)',u.role)}</td>
          </tr>)}
          {users.length===0&&<tr><td colSpan={4} style={{padding:30,textAlign:'center',fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>No users yet</td></tr>}
        </tbody>
      </table>
    </div>
  </div>;
}

// ─── APP ───────────────────────────────────────────────────────────
function App(){
  const [authState,setAuthState]=useState('loading'); // loading|login|pin_setup|app
  const [user,setUser]=useState(null);
  const [profile,setProfile]=useState(null);
  const [showPinSetup,setShowPinSetup]=useState(false);
  const [emailForPin,setEmailForPin]=useState('');
  const [passwordForPin,setPasswordForPin]=useState('');

  // App state
  const [page,setPage]=useState('dashboard');
  const [invoices,setInvoices]=useState([]);
  const [categories,setCategories]=useState([]);
  const [aliases,setAliases]=useState({});
  const [showUpload,setShowUpload]=useState(false);
  const [reviewInv,setReviewInv]=useState(null);
  const [toast,setToast]=useState(null);

  const showToast=(msg,type='')=>setToast({msg,type,id:Date.now()});
  const isAdmin=profile?.role==='admin';

  // ── AUTH ──
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      if(session){loadUser(session.user);}
      else setAuthState('login');
    });
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      if(session){loadUser(session.user);}
      else{setAuthState('login');setUser(null);setProfile(null);}
    });
    return()=>subscription.unsubscribe();
  },[]);

  const loadUser=async(u)=>{
    setUser(u);
    const{data}=await sb.from('profiles').select('*').eq('id',u.id).single();
    setProfile(data);
    if(data)loadData();
    setAuthState('app');
  };

  // ── LOAD DATA FROM SUPABASE ──
  const loadData=async()=>{
    // Load invoices
    const{data:invData}=await sb.from('invoices').select('*').order('created_at',{ascending:false});
    if(invData){
      // Load line items for each invoice
      const{data:liData}=await sb.from('line_items').select('*');
      const liMap={};
      (liData||[]).forEach(li=>{
        if(!liMap[li.invoice_id])liMap[li.invoice_id]=[];
        liMap[li.invoice_id].push({...li,id:li.id,_fromAlias:li.from_alias,_originalCat:li.category,_categoryChanged:false});
      });
      setInvoices(invData.map(inv=>({...inv,line_items:liMap[inv.id]||[]})));
    }
    // Load aliases
    const{data:aliasData}=await sb.from('aliases').select('*');
    if(aliasData){
      const am={};
      aliasData.forEach(a=>{am[a.raw_name.toLowerCase().trim()]={rawName:a.raw_name,category:a.category,canonical:a.canonical,count:a.use_count,date:a.updated_at?.split('T')[0]};});
      setAliases(am);
    }
    // Load categories
    const{data:catData}=await sb.from('categories').select('*').order('name');
    if(catData)setCategories(catData.map(c=>c.name));
  };

  const handleLogin=async(u)=>{
    // Check if user has PIN set up
    const pinUsers=JSON.parse(localStorage.getItem('ii_pin_users')||'[]');
    const hasPIN=pinUsers.some(p=>p.email===u.email);
    if(!hasPIN){
      setUser(u);
      // We need the password for PIN storage — handled in login screen
    }
  };

  const addCategory=async cat=>{
    if(categories.includes(cat))return;
    setCategories(prev=>[...prev,cat].sort());
    await sb.from('categories').insert({name:cat}).on('conflict',()=>{});
  };

  const saveAlias=async(rawName,category,canonical)=>{
    if(!rawName||!category)return;
    const key=rawName.toLowerCase().trim();
    setAliases(prev=>({...prev,[key]:{rawName,category,canonical,count:(prev[key]?.count||0)+1,date:new Date().toISOString().split('T')[0]}}));
    await sb.from('aliases').upsert({raw_name:rawName,category,canonical,use_count:(aliases[key]?.count||0)+1,updated_at:new Date().toISOString(),created_by:user?.id},{onConflict:'raw_name'});
  };

  const deleteAlias=async rawName=>{
    setAliases(prev=>{const n={...prev};delete n[rawName.toLowerCase().trim()];return n;});
    await sb.from('aliases').delete().eq('raw_name',rawName);
  };

  const lookupAlias=rawName=>aliases[rawName?.toLowerCase().trim()]||null;

  const handleSubmit=async inv=>{
    const ni={...inv,id:Date.now().toString(),status:'pending',created_by:user?.id};
    setInvoices(prev=>[ni,...prev]);
    setShowUpload(false);
    showToast(`Invoice ${inv.invoice_number} submitted!`);
    setPage('dashboard');
    // Save to Supabase
    const{data:saved}=await sb.from('invoices').insert({
      invoice_number:inv.invoice_number,vendor:inv.vendor,invoice_date:inv.invoice_date,
      subtotal:inv.subtotal,tax:inv.tax,fees:inv.fees,total:inv.total,
      status:'pending',notes:inv.notes||null,file_name:inv.fileName||null,
      file_type:inv.fileType||null,file_data_url:inv.fileDataUrl||null,
      pages:inv.pages||null,created_by:user?.id,
    }).select().single();
    if(saved){
      // Save line items
      const lis=(inv.line_items||[]).map(l=>({invoice_id:saved.id,name:l.name,canonical:l.canonical,category:l.category,quantity:parseFloat(l.quantity)||0,unit:l.unit||'lb',unit_price:parseFloat(l.unit_price)||0,line_total:parseFloat(l.line_total)||0,from_alias:l._fromAlias||false}));
      if(lis.length)await sb.from('line_items').insert(lis);
      // Update local with real DB id
      setInvoices(prev=>prev.map(i=>i.id===ni.id?{...i,id:saved.id}:i));
    }
  };

  const handleSubmitMany=async invs=>{
    for(const inv of invs)await handleSubmit(inv);
    showToast(`${invs.length} invoices submitted!`);
  };

  const handleApprove=async(inv,changedLines)=>{
    // Save aliases for changed categories
    if(changedLines){
      for(const l of changedLines){
        if(l.name&&l.category&&l._categoryChanged){
          await saveAlias(l.name,l.category,l.canonical||l.name);
          addCategory(l.category);
        }
      }
    }
    setInvoices(prev=>prev.map(i=>(i.id===inv.id)?{...inv,status:'approved'}:i));
    setReviewInv(null);
    showToast(`✓ Invoice ${inv.invoice_number} approved!`);
    // Update in Supabase
    await sb.from('invoices').update({status:'approved',notes:inv.notes||null,approved_by:user?.id,updated_at:new Date().toISOString()}).eq('id',inv.id);
    // Update line items
    if(changedLines){
      for(const l of changedLines){
        if(l._categoryChanged){
          await sb.from('line_items').update({category:l.category}).eq('id',l.id).eq('invoice_id',inv.id);
        }
      }
    }
  };

  const handleReset=()=>{
    if(!confirm('Clear all local data?'))return;
    setInvoices([]);setCategories([]);setAliases([]);
    showToast('Session cleared');setPage('dashboard');
  };

  const handleSignOut=async()=>{
    await sb.auth.signOut();
    setAuthState('login');setUser(null);setProfile(null);
    setInvoices([]);setCategories([]);setAliases({});
  };

  // ── LOADING ──
  if(authState==='loading')return <div style={{position:'fixed',inset:0,background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div style={{textAlign:'center'}}>
      <div style={{fontFamily:'var(--display)',fontSize:36,letterSpacing:4,color:'var(--accent)',marginBottom:16}}>INVOICEINTEL</div>
      <div style={{width:32,height:32,border:'2px solid var(--border2)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin .7s linear infinite',margin:'0 auto'}}/>
    </div>
  </div>;

  // ── LOGIN ──
  if(authState==='login')return <LoginScreen onLogin={u=>loadUser(u)}/>;

  const pending=invoices.filter(i=>i.status==='pending').length;
  const pages={dashboard:'DASHBOARD',invoices:'INVOICES',items:'ITEMS & PRICES',query:'QUERY ENGINE',aliases:'ALIASES',admin:'USER MANAGEMENT',settings:'SETTINGS'};

  return <div style={S.app}>
    {/* SIDEBAR */}
    <div style={S.sidebar}>
      <div style={S.logo}>
        <div style={S.logoWord}>INVOICEINTEL</div>
        <div style={S.logoTag}>Food Cost Intelligence</div>
      </div>
      <nav style={{flex:1,paddingTop:8,overflowY:'auto'}}>
        <div style={S.navSec}>Overview</div>
        <NavItem icon="⬡" label="Dashboard" active={page==='dashboard'} onClick={()=>setPage('dashboard')}/>
        <NavItem icon="◫" label="Invoices" active={page==='invoices'} badge={pending} onClick={()=>setPage('invoices')}/>
        <div style={S.navSec}>Analysis</div>
        <NavItem icon="◉" label="Items & Prices" active={page==='items'} onClick={()=>setPage('items')}/>
        <NavItem icon="◎" label="Query Engine" active={page==='query'} onClick={()=>setPage('query')}/>
        <NavItem icon="◈" label="Aliases" active={page==='aliases'} onClick={()=>setPage('aliases')}/>
        {isAdmin&&<><div style={S.navSec}>Admin</div><NavItem icon="👥" label="User Management" active={page==='admin'} onClick={()=>setPage('admin')}/></>}
        <div style={S.navSec}>System</div>
        <NavItem icon="⚙" label="Settings" active={page==='settings'} onClick={()=>setPage('settings')}/>
      </nav>
      <div style={{padding:'12px 14px',borderTop:'1px solid var(--border)'}}>
        {isAdmin&&<button onClick={()=>setShowUpload(true)} style={{...S.btnPrimary,width:'100%',fontSize:15,marginBottom:8}}>+ NEW INVOICE</button>}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 0'}}>
          <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:140}}>{user?.email}</div>
          <button onClick={handleSignOut} style={{...S.btnGhost,fontSize:10,padding:'3px 8px',flexShrink:0}}>Sign out</button>
        </div>
        <div style={{fontFamily:'var(--mono)',fontSize:9,textAlign:'center',color:isAdmin?'var(--accent)':'var(--blue)',marginTop:2}}>{profile?.role?.toUpperCase()||'VIEWER'}</div>
        {!getApiKey()&&isAdmin&&<div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--red)',textAlign:'center',marginTop:4}}>⚑ No API key — Settings</div>}
      </div>
    </div>

    {/* MAIN */}
    <div style={S.main}>
      <div style={S.topbar}>
        <div style={S.pageTitle}>{pages[page]||page.toUpperCase()}</div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          {pending>0&&isAdmin&&<span style={{background:'rgba(232,197,71,.12)',border:'1px solid var(--accent)',color:'var(--accent)',padding:'5px 12px',borderRadius:4,fontFamily:'var(--mono)',fontSize:11,cursor:'pointer'}} onClick={()=>setPage('invoices')}>⏳ {pending} PENDING</span>}
          <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text3)'}}>{invoices.filter(i=>i.status==='approved').length} inv · ${invoices.filter(i=>i.status==='approved').reduce((s,i)=>s+(parseFloat(i.total)||0),0).toFixed(2)}</span>
        </div>
      </div>
      <div style={S.content}>
        {page==='dashboard'&&<Dashboard invoices={invoices} onReview={isAdmin?setReviewInv:null}/>}
        {page==='invoices'&&<InvoicesPage invoices={invoices} onReview={isAdmin?setReviewInv:null} isAdmin={isAdmin}/>}
        {page==='items'&&<ItemsPage invoices={invoices}/>}
        {page==='query'&&<QueryPage invoices={invoices}/>}
        {page==='aliases'&&<AliasesPage aliases={aliases} onDelete={isAdmin?deleteAlias:null} onEdit={isAdmin?(raw,cat)=>saveAlias(raw,cat,cat):null} categories={categories}/>}
        {page==='admin'&&isAdmin&&<AdminPanel showToast={showToast}/>}
        {page==='settings'&&<SettingsPage onReset={handleReset} showToast={showToast} user={user} profile={profile}/>}
      </div>
    </div>

    {/* MODALS */}
    {showUpload&&isAdmin&&<UploadModal onClose={()=>setShowUpload(false)} onSubmit={handleSubmit} onSubmitMany={handleSubmitMany} categories={categories} addCategory={addCategory} lookupAlias={lookupAlias} isAdmin={isAdmin}/>}
    {reviewInv&&isAdmin&&<ReviewModal invoice={reviewInv} onClose={()=>setReviewInv(null)} onApprove={handleApprove} categories={categories} addCategory={addCategory} lookupAlias={lookupAlias}/>}

    {toast&&<div key={toast.id} style={{position:'fixed',bottom:22,right:22,background:'var(--bg3)',border:'1px solid var(--border2)',borderLeft:`3px solid ${toast.type==='err'?'var(--red)':toast.type==='warn'?'var(--accent)':'var(--green)'}`,borderRadius:4,padding:'10px 16px',fontFamily:'var(--mono)',fontSize:12,zIndex:999,maxWidth:320,cursor:'pointer',animation:'fadeIn .2s ease'}} onClick={()=>setToast(null)}>{toast.msg}</div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
